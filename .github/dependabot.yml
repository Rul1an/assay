version: 2
updates:
  # GitHub Actions - weekly SHA bumps (patch/minor only)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Major version bumps need manual review (breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Rul1an/assay-action: pin file is the execution authority; Dependabot
      # must not bump uses: SHAs independently of .github/assay-action-pin.
      - dependency-name: "Rul1an/assay-action"
      # bencherdev/bencher: pinned to @main SHA, can cause update conflicts
      - dependency-name: "bencherdev/bencher"

  # Cargo - weekly dependency updates, including the fuzz crate's own lockfile.
  #
  # `Cargo.toml` sets `exclude = ["fuzz"]`, so a root-only cargo updater never sees this tree and
  # `fuzz/Cargo.lock` had no updater at all: it sat at workspace 3.34.0 against a 3.35.0 tree,
  # missing a dependency edge, holding six advisories the root lock had already moved past. The
  # lock is kept rather than deleted — cargo-fuzz's own generated `.gitignore` covers
  # `target/corpus/artifacts/coverage` and not `Cargo.lock`, and this is a `publish = false` binary
  # crate, for which committing the lock is the Cargo convention — so it needs an updater to match
  # the staleness assertion the fuzz lane now runs. That assertion is a separate
  # `cargo metadata --locked` step, not a flag on the fuzz run: `cargo fuzz run` has no `--locked`.
  #
  # Two independent cargo updaters (`/` and `/fuzz`) then opened complementary halves of one bump:
  # each PR left the other lock stale, and `cargo metadata --locked` failed on the unmoved tree.
  # `directories` plus `group-by: dependency-name` keeps fuzz covered without splitting a shared
  # dependency into two PRs. Incompatible version constraints still fall back to separate PRs.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # These two move together through the digest crate line and do not land
      # reliably as separate PRs. Listed first so first-match keeps them together
      # instead of the per-name group below splitting them.
      crypto-digest-line:
        patterns:
          - "sha2"
          - "hmac"
      # One PR per remaining dependency across both cargo trees, not one PR per
      # directory. Version updates only; security updates stay ungrouped.
      across-cargo-trees:
        group-by: dependency-name
        exclude-patterns:
          - "sha2"
          - "hmac"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # rand 0.9 requires coordinated updates with ed25519-dalek (crypto RNG trait changes)
      # See: docs/architecture/ADR-020-Dependency-Governance.md
      # Tracking: https://github.com/Rul1an/assay/issues/84
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major"]
      # nix 0.31 triggers Clippy ICE (Internal Compiler Error)
      # Revisit when Clippy is updated or nix stabilizes
      - dependency-name: "nix"
        update-types: ["version-update:semver-major"]
      # The aya stack moves as one unit or not at all (#2972). assay-ebpf pins aya-ebpf and
      # aya-log-ebpf to the git tag aya-v0.13.0, the workspace pins aya and aya-log to the
      # matching released versions, and `object` is exact-pinned to the one aya resolves so a
      # second object never enters the tree (Cargo.toml:114). Dependabot can only ever offer half
      # the change: it opened aya 0.14.0, aya-log 0.3 and object =0.40.0 as three separate PRs,
      # and object =0.40.0 satisfies neither aya version, since aya 0.14 requires object ^0.39.
      - dependency-name: "aya-ebpf"
      - dependency-name: "aya-log-ebpf"
      - dependency-name: "aya"
      - dependency-name: "aya-log"
      - dependency-name: "object"
      # rusqlite 0.38+ removed FromSql/ToSql impl for u64; requires code migration
      # Manual upgrade path: change row.get<_, Option<u64>>() to row.get<_, Option<i64>>().map(|v| v as u64)
      - dependency-name: "rusqlite"
      # sysinfo 0.38+ has breaking API changes (method signatures changed)
      - dependency-name: "sysinfo"
        update-types: ["version-update:semver-major"]
      # 2026-07-28: serial_test 4 requires Rust 1.93.1, above Assay's public Rust 1.89 MSRV.
      # Revisit at the next explicit MSRV review; do not raise the floor for one dev dependency.
      - dependency-name: "serial_test"
        update-types: ["version-update:semver-major"]

  # Distroless base digest for the assay-mcp-server GHCR image.
  - package-ecosystem: "docker"
    directory: "/docker/assay-mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Python (assay-python-sdk)
  - package-ecosystem: "pip"
    directory: "/assay-python-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
