# Product gate for the canonical conformance registry.
#
# No path-filter skip: a required-shaped check that skips when the registry is
# untouched is a silent pass. Always run; the job is stdlib and cheap.
#
# Inventory coverage is conformance/registry.py.
# Execution completeness for merge is:
#   python3 conformance/run_all.py --require-complete --completion-scope required
# Global complete stays executed==declared over all six and is still false here.
# Do not map exit 3 to 0.

name: Conformance inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  inventory:
    name: conformance-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Canonical registry
        run: python3 conformance/registry.py

      - name: Registry and runner tests
        run: |
          python3 -W error::ResourceWarning conformance/tests/test_registry.py
          python3 -W error::ResourceWarning conformance/tests/test_run_all.py
          python3 -W error::ResourceWarning conformance/tests/test_completion_scope.py

      - name: Require-complete required-scope inventory
        run: python3 conformance/run_all.py --require-complete --completion-scope required
