# PR: vergelijk altijd met main-baseline via start-point + clone-thresholds.
# Gebruik expliciet `main` als start-point zodat feature/base branches die in
# Bencher gearchiveerd zijn geen 404 "Head Version not found" veroorzaken.
# Alleen same-repo PRs (secrets niet beschikbaar op forks).
# Vereist: BENCHER_PROJECT, BENCHER_API_TOKEN.
#
# Thresholds (aug 2026):
# - Cloned from the main baseline (--start-point-clone-thresholds)
# - NO --err: alerts are warnings only
#
# A Bencher Threshold is scoped to (Branch, Testbed, Measure) and applies to *every*
# benchmark in that scope; there is no per-benchmark threshold. Testbed is therefore the
# only dimension available for giving two benchmarks different alert models, and these
# testbed names describe what is being characterised, not which machine runs it:
#
#   ubuntu-latest-store-code   swc/*  code cost, write barrier held constant  -> gates PRs
#   ubuntu-latest-store-fsync  sw/*   shipped durability, host-dominated      -> main trend
#   ubuntu-latest              sr/wc  full `assay run` subprocess             -> unchanged
#
# Only the code-cost group is compared on pull requests. `sw/*` measures the runner's
# write barrier (98.2% of its wall time is filesystem work), so a PR comparison of it
# reports host luck; it stays a main-branch trend under a variance-robust IQR model.
# See docs/PERFORMANCE-ASSESSMENT.md, "Why `sw/*` is not a gate".
name: Perf (PR compare)

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, closed]

permissions:
  pull-requests: write
  contents: read

jobs:
  detect-benchmark-relevance:
    name: Detect benchmark-relevant changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      store: ${{ steps.detect.outputs.store_relevant }}
      suite: ${{ steps.detect.outputs.suite_relevant }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The previous gate matched `^crates/`, i.e. all 21 workspace crates, so
      # store_write_heavy ran and alerted for changes outside assay-core's compilation
      # unit (#2119, #2114, #2074). Relevance is now derived per bench from the
      # cargo-metadata dependency closure; scripts/ci/test_perf_bench_relevance.py pins
      # those three PRs as regression fixtures.
      - name: Detect benchmark-relevant paths
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The script writes only to stdout and never opens $GITHUB_OUTPUT or
          # $GITHUB_STEP_SUMMARY itself: opening a path read from the environment is an
          # uncontrolled-path sink (CodeQL py/path-injection). Routing happens here.
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
            | python3 scripts/ci/perf_bench_relevance.py \
            | tee relevance.txt
          grep -E '^(store|suite)_relevant=(true|false)$' relevance.txt >> "$GITHUB_OUTPUT"
          {
            echo "## Perf benchmark relevance"
            echo
            echo '```'
            cat relevance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  benches:
    name: Criterion compare (PR vs main)
    needs: detect-benchmark-relevance
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' && (needs.detect-benchmark-relevance.outputs.store == 'true' || needs.detect-benchmark-relevance.outputs.suite == 'true')
    runs-on: ubuntu-latest
    # Bencher 404 (e.g. main baseline not found) should not block PR merge
    continue-on-error: true
    env:
      QUICK: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Install Linux deps
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y -o Acquire::Retries=10 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev
          }
      - uses: bencherdev/bencher@0f8f620172ccd6225d40a7590598eb7b41718af8 # v0.6.2
      # stdin/pipe mode: cargo bench output piped to bencher run (no command after --)
      #
      # `-- '^swc/'` is a Criterion benchmark filter: only the code-cost group is measured
      # and reported on pull requests. The shipped-durability group (`sw/*`) is not run
      # here at all, because comparing it PR-to-main reports the runner's write-barrier
      # latency rather than the change under review.
      - name: Criterion (store_write_heavy, code cost)
        if: needs.detect-benchmark-relevance.outputs.store == 'true'
        env:
          BENCHER_PROJECT: ${{ secrets.BENCHER_PROJECT }}
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BENCHER_PROJECT" ] || [ -z "$BENCHER_API_TOKEN" ]; then echo "Bencher not configured, skipping."; exit 0; fi
          cargo bench -p assay-core --bench store_write_heavy -- '^swc/' 2>&1 \
            | grep -v "Gnuplot not found" \
            | bencher run \
                --project "$BENCHER_PROJECT" \
                --token "$BENCHER_API_TOKEN" \
                --branch "$GITHUB_HEAD_REF" \
                --start-point main \
                --start-point-clone-thresholds \
                --start-point-reset \
                --testbed ubuntu-latest-store-code \
                --adapter rust_criterion \
                --ci-id store_write_heavy \
                --github-actions "$GITHUB_TOKEN"
          test -d target/criterion
          find target/criterion -name estimates.json -print -quit | grep -q .

      - name: Criterion (suite_run_worstcase)
        if: needs.detect-benchmark-relevance.outputs.suite == 'true'
        env:
          BENCHER_PROJECT: ${{ secrets.BENCHER_PROJECT }}
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BENCHER_PROJECT" ] || [ -z "$BENCHER_API_TOKEN" ]; then echo "Bencher not configured, skipping."; exit 0; fi
          cargo bench -p assay-cli --bench suite_run_worstcase 2>&1 \
            | grep -v "Gnuplot not found" \
            | bencher run \
                --project "$BENCHER_PROJECT" \
                --token "$BENCHER_API_TOKEN" \
                --branch "$GITHUB_HEAD_REF" \
                --start-point main \
                --start-point-clone-thresholds \
                --start-point-reset \
                --testbed ubuntu-latest \
                --adapter rust_criterion \
                --ci-id suite_run_worstcase \
                --github-actions "$GITHUB_TOKEN"
          test -d target/criterion
          find target/criterion -name estimates.json -print -quit | grep -q .

  archive_pr_branch:
    name: Archive closed PR branch with Bencher
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: bencherdev/bencher@0f8f620172ccd6225d40a7590598eb7b41718af8 # v0.6.2
      - name: Archive closed PR branch with Bencher
        env:
          BENCHER_PROJECT: ${{ secrets.BENCHER_PROJECT }}
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
        run: |
          if [ -z "$BENCHER_PROJECT" ] || [ -z "$BENCHER_API_TOKEN" ]; then
            echo "Bencher not configured, skipping."
            exit 0
          fi
          # Archive may fail if PR was closed before any benchmarks ran (branch doesn't exist in Bencher)
          # This is expected and non-fatal
          if ! bencher archive \
            --project "$BENCHER_PROJECT" \
            --token "$BENCHER_API_TOKEN" \
            --branch "$GITHUB_HEAD_REF" 2>&1; then
            echo "::notice::Branch '$GITHUB_HEAD_REF' not found in Bencher (no benchmarks ran). Skipping archive."
          fi
