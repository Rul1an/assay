name: Scheduled OSV Advisory

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-non-rust:
    name: OSV non-Rust advisory scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve OSV target coverage
        id: osv-targets
        shell: bash
        run: |
          set -euo pipefail

          target_file=".github/osv/non-rust-manifests.txt"
          listed=()
          while IFS= read -r path; do
            listed+=("$path")
          done < <(grep -Ev '^[[:space:]]*(#|$)' "$target_file" | LC_ALL=C sort -u)

          if [ "${#listed[@]}" -eq 0 ]; then
            echo "::error::OSV target list is empty"
            exit 1
          fi

          missing=0
          for path in "${listed[@]}"; do
            if ! git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              echo "::error file=$target_file::listed OSV target is not tracked: $path"
              missing=1
            elif [ ! -f "$path" ]; then
              echo "::error file=$target_file::listed OSV target is missing: $path"
              missing=1
            fi

            case "$path" in
              Cargo.lock|*/Cargo.lock)
                echo "::error file=$target_file::Rust lockfile belongs to cargo-deny/cargo-audit, not scheduled OSV: $path"
                missing=1
                ;;
            esac
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          expected="$(mktemp)"
          discovered="$(mktemp)"
          printf '%s\n' "${listed[@]}" > "$expected"
          git ls-files | grep -E '(^|/)(package-lock\.json|requirements[^/]*\.txt)$' | LC_ALL=C sort -u > "$discovered"

          if unlisted="$(comm -13 "$expected" "$discovered")" && [ -n "$unlisted" ]; then
            while IFS= read -r path; do
              echo "::error file=$target_file::tracked non-Rust dependency input is not in scheduled OSV target list: $path"
            done <<< "$unlisted"
            exit 1
          fi

          {
            echo "scan_args<<OSV_SCAN_ARGS"
            echo "--format=json"
            echo "--output=osv-results.json"
            printf '%s\n' "${listed[@]}"
            echo "OSV_SCAN_ARGS"
          } >> "$GITHUB_OUTPUT"

          echo "osv-target-count=${#listed[@]}"

      - name: Run OSV scanner
        id: osv-scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: ${{ steps.osv-targets.outputs.scan_args }}
        continue-on-error: true

      - name: Build advisory SARIF
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=false
            --fail-on-vuln=false

      # Public manifest scan only; retain the original pair even if binding fails.
      - name: Retain OSV scanner and reporter outputs
        if: ${{ always() && steps.osv-targets.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-non-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            osv-results.json
            osv-results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Bind scanner findings to reporter SARIF
        shell: bash
        env:
          OSV_OUTCOME: ${{ steps.osv-scan.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/ci/bind-osv-json-sarif-counts.py

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner-non-rust
