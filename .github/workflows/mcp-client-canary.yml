name: MCP client canary

# Drives `assay mcp wrap` with the official MCP TypeScript client in both negotiation modes:
# the documented Filesystem recipe with its tool pins, and a pinned tool under a changing tool
# list. Every run checks two binaries with the same fixture: `head`, built from this checkout,
# and `release`, the release the recipe names, installed through scripts/install.sh with
# provenance required into target/assay-release. The runner takes only these two fixed routes.
# The client package is updated by Dependabot, so a client release that changes what hosts send
# turns this red before users meet it. This is an Assay compatibility check with pinned
# packages, not an MCP conformance claim.

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-client-canary.yml"
      - "scripts/ci/mcp-client-canary/**"
      - "scripts/ci/test-mcp-client-canary-contract.sh"
      - "docs/guides/editor-mcp-recipe.md"
      - "crates/assay-core/src/mcp/**"
      - "crates/assay-cli/src/**"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mcp-client-canary.yml"
      - "scripts/ci/mcp-client-canary/**"
      - "scripts/ci/test-mcp-client-canary-contract.sh"
      - "docs/guides/editor-mcp-recipe.md"
      - "crates/assay-core/src/mcp/**"
      - "crates/assay-cli/src/**"
      - "Cargo.lock"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-client-canary-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"

jobs:
  canary:
    name: MCP client canary (wrap, legacy and auto)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out Assay
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run workflow contract tests
        run: bash scripts/ci/test-mcp-client-canary-contract.sh

      - name: Set up Rust toolchain and cache
        uses: ./.github/actions/setup-rust

      - name: Install Linux deps (for build scripts)
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev
          }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned MCP packages
        working-directory: scripts/ci/mcp-client-canary
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build assay
        run: cargo build --locked -p assay-cli --bin assay

      - name: Install the release the recipe names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node scripts/ci/mcp-client-canary/canary.mjs --recipe-release)"
          echo "recipe names Assay ${version}; install pin $(cat .github/assay-release-tag)"
          ASSAY_VERSION="${version}" ASSAY_REQUIRE_PROVENANCE=1 ASSAY_INSTALL_DIR=target/assay-release sh scripts/install.sh

      - name: Run the canary
        run: node scripts/ci/mcp-client-canary/canary.mjs --binary head --binary release
