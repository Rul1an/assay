name: Structurizr Validate

on:
  pull_request:
    paths:
      - "docs/architecture/structurizr/**"
      - "scripts/structurizr-validate.sh"
      - "scripts/structurizr-cli-image.sh"
      - ".github/workflows/structurizr-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate Structurizr workspaces
        run: bash scripts/structurizr-validate.sh
