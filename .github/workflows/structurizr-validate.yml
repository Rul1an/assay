name: Structurizr Validate

on:
  pull_request:
    paths:
      - "docs/architecture/structurizr/**"
      - "scripts/structurizr-validate.sh"
      - "scripts/structurizr-cli-image.sh"
      - ".github/structurizr-cli-image"
      - ".github/workflows/structurizr-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Structurizr workspaces
        env:
          # Fail closed on the digest-pinned image; never a host structurizr-cli.
          STRUCTURIZR_FORCE_DOCKER: "1"
        run: bash scripts/structurizr-validate.sh
