# Feasibility probe for one Windows host. A completed result is not five-platform acceptance.
#
# A push of this branch also starts .github/workflows/assay.yml. That workflow is
# `on: [push, pull_request]` with no branch filter and no path filter.
# assay-security.yml has a push trigger with no branch filter, but only when its
# path list matches. The two paths below are not on that list.

name: Windows AppContainer feasibility

on:
  push:
    branches:
      - cursor/windows-offline-feasibility
    paths:
      - .github/workflows/experiment-windows-appcontainer.yml
      - scripts/experiments/windows_appcontainer_probe.py

# The pinned upload-artifact calls @actions/artifact 6.2.0. That client
# uploads with ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL. It does not
# read GITHUB_TOKEN, so this job does not grant actions: write.
permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Read pinned cosign release
        id: cosign_pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("scripts/experiments/windows_appcontainer_probe.py").read_text(encoding="utf-8"));
          found = [n.value.value for n in tree.body if isinstance(n, ast.Assign) for t in n.targets if isinstance(t, ast.Name) and t.id == "COSIGN_RELEASE"];
          assert len(found) == 1 and isinstance(found[0], str);
          print(found[0])')"
          echo "cosign release ${pin}"
          echo "release=${pin}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.cosign_pin.outputs.release }}

      - name: Run AppContainer probe
        shell: pwsh
        run: python scripts/experiments/windows_appcontainer_probe.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-appcontainer-results
          path: results/
          if-no-files-found: error
