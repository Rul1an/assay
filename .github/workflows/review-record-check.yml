name: Review Record Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: review-record-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Witness trusted base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"

      - name: Checker self-test
        shell: bash
        run: python3 scripts/ci/assay_review_record_check.py --self-test

      - name: Check exact-head review record
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/assay_review_record_check.py --pr "$PR_NUMBER"
