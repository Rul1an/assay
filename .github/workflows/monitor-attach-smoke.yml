name: Monitor attach smoke

# Attach-health gate for `assay monitor` on the delegated eBPF host. Proves ONE thing only: that
# `assay monitor` can load and attach its observation probes on this kernel. No policy, no egress, no
# enforcement. This exists because a green `runner-spike` delegated lane is NOT evidence that
# `assay monitor` can attach — they attach different program sets (see #1570). Manual dispatch so it
# does not block unrelated PRs; run it to verify attach-health after touching monitor/eBPF code.
# `proof_mode=send-matrix` reuses this registered workflow_dispatch entrypoint (GitHub cannot start a
# workflow file that exists only on a feature branch). Default remains attach-smoke.

on:
  workflow_dispatch:
    inputs:
      build_ebpf:
        description: "Build target/assay-ebpf.o from source before the smoke run"
        required: false
        default: "true"
      proof_mode:
        description: "attach-smoke (default) or send-matrix exact-syscall/effect cells"
        required: false
        type: choice
        options:
          - attach-smoke
          - send-matrix
        default: attach-smoke

permissions:
  contents: read

concurrency:
  group: assay-bpf-runner-host
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, linux, assay-bpf-runner]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build assay-cli
        run: cargo build -p assay-cli --release

      - name: Build eBPF object
        id: canonical-ebpf
        if: ${{ github.event.inputs.build_ebpf != 'false' }}
        # Build the eBPF object exactly like the delegated runner-spike gate: install the eBPF
        # toolchain and build in release with --no-docker. A debug-mode build produces programs the
        # verifier rejects (empty / "last insn is not an exit or jmp"), which is what made an earlier
        # smoke run mislook like an assay monitor attach bug.
        uses: ./.github/actions/canonical-ebpf-build
        with:
          clean-ebpf-crate: "true"

      - name: Show eBPF build provenance
        if: ${{ github.event.inputs.build_ebpf != 'false' }}
        run: python3 -m json.tool "${{ steps.canonical-ebpf.outputs.provenance-path }}"

      - name: Smoke - assay monitor must attach its observation probes
        if: ${{ github.event.inputs.proof_mode != 'send-matrix' }}
        run: |
          set -euo pipefail
          OBJ="target/assay-ebpf.o"
          test -f "$OBJ"
          OUT="$RUNNER_TEMP/monitor-smoke.log"
          # Attach-only run: no --policy, so no enforcement path is exercised. We only assert that the
          # observation probes load and attach on this kernel. Pipe through tee (no redirect under sudo)
          # and read the monitor's own exit code from PIPESTATUS.
          set +e
          sudo -E timeout 30 ./target/release/assay monitor --monitor-all --ebpf "$OBJ" \
            --duration 3s --print 2>&1 | tee "$OUT"
          code=${PIPESTATUS[0]}
          set -e
          echo "---- assay monitor exit code: $code ----"
          if grep -q "Failed to attach probes" "$OUT"; then
            echo "SMOKE FAIL: assay monitor could not attach its observation probes on this host (see #1570)."
            exit 1
          fi
          if ! grep -q "Assay Monitor running" "$OUT"; then
            echo "SMOKE FAIL: assay monitor did not reach the running state (attach health unproven)."
            exit 1
          fi
          echo "SMOKE PASS: assay monitor attached its observation probes."

      - name: ABI skew check - loaded object must emit the pinned MonitorEvent size
        if: ${{ github.event.inputs.proof_mode != 'send-matrix' }}
        # Separate step so the attach proof above stays a pure attach proof. This is the
        # mechanical close condition of #1575: a canonical same-commit build that still emits
        # size-mismatched records means the loaded object was stale, and that must FAIL the run
        # instead of sitting quietly in the log (which is how run 28666638414 went green while
        # carrying got=520/need=552).
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/monitor-smoke.log"
          if grep -q "monitor event size mismatch" "$OUT"; then
            echo "ABI SKEW FAIL: the loaded eBPF object emitted records that do not match the pinned MonitorEvent size (see #1575)."
            grep -m1 "invalid event size" "$OUT" || true
            exit 1
          fi
          echo "ABI SKEW PASS: no MonitorEvent size mismatch observed."

      - name: Compile syscall harness
        if: ${{ github.event.inputs.proof_mode == 'send-matrix' }}
        run: |
          cc -Wall -Werror -o "$RUNNER_TEMP/s1b-harness" scripts/ci/s1b-send-syscall-matrix.c
          "$RUNNER_TEMP/s1b-harness" --timeout-selftest
          fifo="$RUNNER_TEMP/s1b-fifo-selftest"
          rm -f "$fifo"
          mkfifo "$fifo"
          "$RUNNER_TEMP/s1b-harness" --fifo-selftest "$fifo"
          rm -f "$fifo"
          bash scripts/ci/run-send-syscall-matrix.sh cleanup-selftest
          bash scripts/ci/run-send-syscall-matrix.sh mutation-selftest

      - name: Positive syscall/effect matrix
        if: ${{ github.event.inputs.proof_mode == 'send-matrix' }}
        run: |
          set -euo pipefail
          test -f target/assay-ebpf.o
          sudo -E env HARNESS_BIN="$RUNNER_TEMP/s1b-harness" WORKDIR="$RUNNER_TEMP/s1b-positive" \
            bash scripts/ci/run-send-syscall-matrix.sh positive

      - name: Attach-disabled negative matrix
        if: ${{ github.event.inputs.proof_mode == 'send-matrix' }}
        run: |
          set -euo pipefail
          src=crates/assay-monitor/src/loader.rs
          bak="$RUNNER_TEMP/loader.rs.s1b.bak"
          bin=target/release/assay
          binbak="$RUNNER_TEMP/assay.s1b.bin.bak"
          cp "$src" "$bak"
          cp "$bin" "$binbak"
          restore() {
            cp "$bak" "$src"
            cp "$binbak" "$bin.tmp"
            cmp -s "$bin.tmp" "$binbak"
            mv -f "$bin.tmp" "$bin"
            test -f "$bin"
            cmp -s "$bin" "$binbak"
            rm -f "$bak" "$binbak" "$bin.tmp"
          }
          trap restore EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          bash scripts/ci/run-send-syscall-matrix.sh disable-send-attach
          cargo build -p assay-cli --release
          python3 -c 'import pathlib,sys; sys.exit(0 if b"s1b-cell7-disabled" in pathlib.Path("target/release/assay").read_bytes() else 1)'
          sudo -E env HARNESS_BIN="$RUNNER_TEMP/s1b-harness" WORKDIR="$RUNNER_TEMP/s1b-disabled" \
            bash scripts/ci/run-send-syscall-matrix.sh attach-disabled
