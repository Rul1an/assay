name: CI

on:
  push:
    branches: [ main, "debug/**", "docs/auto-update" ]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number for an exact-head docs-only run"
        required: false
        type: string
      expected_head_sha:
        description: "Expected head SHA for an exact-head docs-only run"
        required: false
        type: string

permissions: {}

env:
  ASSAY_PUBLIC_MSRV: "1.89.0"

jobs:
  scope:
    name: Detect CI scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lightweight_only: ${{ steps.detect.outputs.lightweight_only }}
      changed_file_count: ${{ steps.detect.outputs.changed_file_count }}
      mcp_registry_touched: ${{ steps.detect.outputs.mcp_registry_touched }}
      ebpf_smoke_required: ${{ steps.detect.outputs.ebpf_smoke_required }}
      self_hosted_ebpf_required: ${{ steps.detect.outputs.self_hosted_ebpf_required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: detect
        shell: bash
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/changed_files.txt"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" &&
                -n "$DISPATCH_PR_NUMBER" ]]; then
            if [[ -z "$EXPECTED_HEAD_SHA" ||
                  "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "dispatched CI head ${GITHUB_SHA} does not match expected ${EXPECTED_HEAD_SHA:-<empty>}" >&2
              exit 2
            fi
            pr_head="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}" \
                --jq '.head.sha'
            )"
            if [[ "$pr_head" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "PR #${DISPATCH_PR_NUMBER} moved from ${EXPECTED_HEAD_SHA} to ${pr_head}" >&2
              exit 2
            fi
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename' > "$changed_file"
            if [[ ! -s "$changed_file" ]] ||
              grep -Ev '^(docs/|.*\.md$|mkdocs\.yml$)' "$changed_file" >/dev/null; then
              echo "workflow_dispatch PR must contain a non-empty docs-only file set" >&2
              exit 2
            fi
            lightweight_only=true
            mcp_registry_touched=false
            ebpf_smoke_required=false
            self_hosted_ebpf_required=false
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            : > "$changed_file"
            lightweight_only=false
            mcp_registry_touched=false
            ebpf_smoke_required=true
            self_hosted_ebpf_required=true
          else
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
              head_sha="${{ github.sha }}"
              git diff --name-only "${base_sha}...${head_sha}" > "$changed_file"
            else
              base_sha="${{ github.event.before }}"
              head_sha="${{ github.sha }}"
              if [[ "${base_sha}" =~ ^0+$ ]]; then
                git diff-tree --no-commit-id --name-only -r "${head_sha}" > "$changed_file"
              else
                git diff --name-only "${base_sha}...${head_sha}" > "$changed_file"
              fi
            fi

            if [[ ! -s "$changed_file" ]]; then
              lightweight_only=false
            elif grep -Ev '^(docs/|.*\.md$|mkdocs\.yml$|scripts/ci/review-[^/]+\.sh$|\.github/ISSUE_TEMPLATE/[^/]+\.ya?ml$|\.github/DISCUSSION_TEMPLATE/[^/]+\.ya?ml$)' "$changed_file" >/dev/null; then
              lightweight_only=false
            else
              lightweight_only=true
            fi

            if grep -E '^(crates/assay-mcp-server/|packaging/mcpb/|packaging/mcp-registry/|scripts/ci/(build_mcpb_bundle|write_sha256_sidecar)\.sh$|scripts/ci/render_registry_server_json\.sh$|scripts/publish-mcpcentral\.sh$|\.github/workflows/release\.yml$)' "$changed_file" >/dev/null; then
              mcp_registry_touched=true
            else
              mcp_registry_touched=false
            fi

            if grep -E '^(crates/assay-ebpf/|crates/assay-monitor/|infra/bpf-runner/|scripts/verify_lsm_docker\.sh$|scripts/ci/(apt_ports_failover|lsm_deny_smoke)\.sh$)' "$changed_file" >/dev/null; then
              ebpf_smoke_required=true
              self_hosted_ebpf_required=true
            else
              ebpf_smoke_required=false
              self_hosted_ebpf_required=false
            fi
          fi

          {
            echo "lightweight_only=${lightweight_only}"
            echo "changed_file_count=$(wc -l < "$changed_file" | tr -d ' ')"
            echo "mcp_registry_touched=${mcp_registry_touched}"
            echo "ebpf_smoke_required=${ebpf_smoke_required}"
            echo "self_hosted_ebpf_required=${self_hosted_ebpf_required}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## CI scope"
            echo "- event: ${GITHUB_EVENT_NAME}"
            echo "- lightweight_only: ${lightweight_only}"
            echo "- changed_file_count: $(wc -l < "$changed_file" | tr -d ' ')"
            echo "- mcp_registry_touched: ${mcp_registry_touched}"
            echo "- ebpf_smoke_required: ${ebpf_smoke_required}"
            echo "- self_hosted_ebpf_required: ${self_hosted_ebpf_required}"
            if [[ -s "$changed_file" ]]; then
              echo ""
              echo "### Changed files"
              sed 's/^/- /' "$changed_file"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Dependency security (advisories, licenses, sources) ---
  deps-security:
    name: Dependency Security (cargo-deny + audit)
    needs: [scope]
    if: needs.scope.outputs.lightweight_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Check Aya/eBPF dependency alignment
        run: ./scripts/ci/check-aya-ebpf-alignment.sh
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check advisories bans licenses sources
      - name: cargo audit (RustSec)
        run: |
          rm -rf ~/.cargo/advisory-db
          # RUSTSEC-2023-0071 (rsa Marvin Attack): no fixed upgrade; assay-mcp-server JWT (see deny.toml)
          cargo audit --ignore RUSTSEC-2023-0071

      - name: cargo audit (RustSec) — fuzz lockfile
        # Runs when the root audit above fails, so coverage does not drop out exactly when the tree
        # is already unhealthy. `!cancelled()` rather than `always()`: a cancelled run should stop,
        # and `always()` would keep this step going after someone hit cancel or a timeout fired.
        if: ${{ !cancelled() }}
        run: |
          # `Cargo.toml` sets `exclude = ["fuzz"]`, so the audit above cannot see this lockfile and
          # it was covered by nothing: not this job, not the OSV scanner (which rejects Rust locks
          # by design), not dependabot (scoped to `/`). It accumulated six advisories the root tree
          # had already moved past. Audited separately because the exclusion is deliberate and the
          # blind spot it creates is not.
          #
          # Run from a directory with no `.cargo/audit.toml`. cargo-audit reads that config from the
          # cwd, so invoking this from the repo root would silently inherit the root's ignore list —
          # measured: RUSTSEC-2023-0071 is suppressed from the root and reported from elsewhere. That
          # would defeat the reason this step exists. An advisory that matches only the fuzz tree is
          # then a deliberate decision, not a silent pass; there is nowhere for it to be quietly
          # excused, which is the point.
          ( cd "${RUNNER_TEMP}" && cargo audit --file "${GITHUB_WORKSPACE}/fuzz/Cargo.lock" )

  clippy:
    name: Clippy (deny warnings)
    needs: [scope]
    if: needs.scope.outputs.lightweight_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Swatinem/rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux deps (for build scripts)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev
          }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--all-targets` does not imply `--all-features`, so any test file gated behind a feature is
      # invisible to the sweep above: cfg strips it to an empty crate and clippy lints nothing.
      # no_passthrough_e2e.rs is gated on `test-outbound` and would otherwise be the one test in
      # the workspace that no lint job ever sees.
      # The deny list matches split-wave0-gates.yml, which carries no --all-features either, so this
      # step is the only place the gated file meets `clippy::todo` and `clippy::unimplemented`.
      # Denying only `-D warnings` here would leave a placeholder legal in exactly one test file.
      - run: cargo clippy -p assay-mcp-server --all-targets --features test-outbound -- -D warnings -D clippy::todo -D clippy::unimplemented

  rustdoc:
    name: Rustdoc (deny warnings)
    needs: [scope]
    if: needs.scope.outputs.lightweight_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Swatinem/rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux deps (for build scripts)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev
          }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Clippy above never sees rustdoc's lints: broken intra-doc links, unclosed HTML tags in doc
      # comments and bare URLs are diagnosed by rustdoc alone, and they are warn-by-default, so
      # nothing failed while a crate's documentation quietly stopped building. `assay-evidence`
      # carried a `redundant explicit link target` that survived exactly this way.
      #
      # The workspace pass covers every default documentation surface. `--all-features` is too
      # broad here because it also enables platform-specific, experimental, and test-only
      # surfaces. Stable public opt-in features still need explicit coverage: assay-registry's
      # OIDC API is absent from its default feature set, so document that supported surface in a
      # second pass. A doc link that only resolves under a test feature must still be written as
      # code text — see `crates/assay-mcp-server/src/auth/sensitive_headers.rs`.
      #
      # `--no-deps` keeps the failure surface to this workspace; a warning in a third-party crate
      # is not ours to fix and must not be able to redden this gate.
      - run: |
          cargo doc --workspace --no-deps
          cargo doc -p assay-registry --features oidc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  public-msrv:
    name: Public crates MSRV
    needs: [scope]
    if: needs.scope.outputs.lightweight_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Linux deps (for build scripts)
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev
          }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.ASSAY_PUBLIC_MSRV }}
      - name: Swatinem/rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: public-msrv-${{ env.ASSAY_PUBLIC_MSRV }}
      - name: Test MSRV package selection
        run: python3 scripts/ci/test_check_msrv_metadata.py
      - name: Verify public crate MSRV
        run: scripts/ci/check-msrv-policy.sh

  distribution-boundary:
    name: Distribution boundary check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check distribution boundary
        run: ./scripts/ci/check-distribution-boundary.sh

  publish-shape-cli:
    # Guardrail: catch v3.11.0-style regressions where `assay-cli` accumulates
    # a direct dependency on a `publish = false` workspace crate, which would
    # only surface as a release-time `cargo publish` failure on tag push.
    #
    # We cannot use `cargo publish --dry-run` on PR CI because version pins
    # naturally point at a not-yet-published workspace version during release
    # prep. Instead we statically verify the shape that matters: every dep in
    # `assay-cli`'s active publish-feature set must either be `optional = true`
    # or target a workspace crate with `publish = true`.
    name: Publish-shape guardrail (assay-cli)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify no non-optional publish=false deps in assay-cli
        shell: bash
        run: ./scripts/ci/check_assay_cli_publish_shape.sh

  public-crate-policy:
    # Guardrail: catch v3.11.2-style regressions where a workspace member
    # flips between `publish = true` and `publish = false`, or the
    # `publish_idempotent.sh` CRATES array drifts from the public crate
    # contract, without the policy script's allow-list being updated in
    # the same PR.
    #
    # `check-public-crate-policy.sh` previously only ran inside the release
    # workflow, so a divergence between the policy allow-list and the
    # actual workspace shape only surfaced at tag time after merge. This
    # PR-CI mirror runs the same script on every PR so the gate fires
    # before tag, not after.
    name: Public crate policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Verify public crate contract is consistent
        run: bash scripts/ci/check-public-crate-policy.sh

  vendored-packs:
    name: Vendored Pack Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check vendored pack files are in sync
        run: ./scripts/check-vendored-packs.sh

  release-asset-contract:
    name: Release asset contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify portable checksum production and flat download layout
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/test-write-sha256-sidecar.sh
          bash scripts/ci/test-release-assets.sh

  mcp-registry-foundation:
    name: MCP Registry foundation smoke
    needs: [scope]
    if: needs.scope.outputs.mcp_registry_touched == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: MCP Registry foundation smoke
        run: bash scripts/ci/mcp_registry_foundation_smoke.sh

  perf:
    name: Criterion benches (store + suite)
    needs: [scope]
    if: needs.scope.outputs.lightweight_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Swatinem/rust-cache
        id: rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux deps (for build scripts)
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang libsqlite3-dev
          }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      # Pins the PRs that alerted on benchmarks they could not affect (#2119, #2114, #2074)
      # so the perf_pr.yml relevance gate cannot regress back to matching all of crates/.
      - name: Test perf benchmark relevance gate
        run: python3 scripts/ci/test_perf_bench_relevance.py
      # Runs both groups: sw/* (shipped durability) and swc/* (code cost). The pragma
      # assertion in make_store() fails here if swc/* silently reverts to measuring fsync.
      - name: Criterion (store_write_heavy)
        env:
          QUICK: "1"
        run: cargo bench -q -p assay-core --bench store_write_heavy
      - name: Criterion (suite_run_worstcase)
        env:
          QUICK: "1"
        run: cargo bench -q -p assay-cli --bench suite_run_worstcase
      - name: List Criterion output (debug)
        run: |
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-<unset>}"
          ls -la target/criterion 2>/dev/null || echo "target/criterion missing or empty"
          du -sh target/criterion 2>/dev/null || true
      - name: Upload Criterion report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 5
          if-no-files-found: ignore
      - name: Prove cache hit (job summary)
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          echo "cache-hit=${CACHE_HIT}"
          echo "cache-hit=${CACHE_HIT}" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Build + Test (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.lightweight_only != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Free hosted runner disk (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Disk before cleanup ==="
          df -h /

          # Hosted Ubuntu images include large SDK/tool caches that this Rust
          # workspace job does not use. Removing them before Rust cache restore
          # leaves room for target/, sccache, and feature-enabled E2E builds.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /

      - name: Install mold (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mold clang libsqlite3-dev || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mold clang libsqlite3-dev
          }

      - name: Sccache
        if: runner.os != 'macOS'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
          cache-directories: |
            ~/.sccache
          cache-on-failure: true

      - name: Configure Environment (with sccache)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_DIR=$HOME/.sccache"
            echo "SCCACHE_GHA_ENABLED=false"
            echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse"
          } >> "$GITHUB_ENV"

      - name: Configure Environment (macOS no sccache)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          {
            echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse"
          } >> "$GITHUB_ENV"

      - name: Configure Linker (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      # Linux: Test everything except eBPF and integration tests
      - name: Test Workspace (Linux)
        if: runner.os == 'Linux'
        # no_passthrough_e2e is gated on `test-outbound` and so compiles to nothing here; it has a
        # dedicated step below. It used to need an explicit --skip because it compiled everywhere
        # and shelled out to its own feature-enabled cargo build.
        run: cargo test --locked --workspace --exclude assay-ebpf --exclude assay-it

      # E6a.3 no-pass-through: E2E invariant test (requires test-outbound feature).
      #
      # Runs on every OS, because this is the only job that RUNS the test — the workspace runs
      # above and below build it out, and the feature-enabled clippy step near the top of this
      # file compiles it but executes nothing. That also means a missing or misspelled feature
      # flag here would be silent: `cargo test` exits 0 when zero tests match. So assert the test
      # actually executed rather than trusting the exit code.
      - name: Test MCP no-pass-through E2E (E6a.3)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p assay-mcp-server --features test-outbound --no-fail-fast no_passthrough \
            2>&1 | tee "$RUNNER_TEMP/e6a3.log"
          # Two questions. Every previous version of this guard folded them into one pattern and
          # got one of them wrong: too strict and it called a passing test absent, too loose and
          # it called a skipped test present. Pass-versus-fail is not among them — `set -o
          # pipefail` settles that above, so a test that ran and failed never reaches here.
          #
          # The two are sequential, not independent: question 2 rescans the lines question 1
          # matched. That is a known and deliberate compromise. Broadening question 1 to survive
          # interleaved child output means arbitrary server stderr can end up inside the string
          # question 2 searches, so a log line containing the word "ignored" can trip it. The
          # alternative — anchoring question 2 to the status field — is more precise but inverts
          # the failure direction: a shape it fails to anchor passes the guard, and the step goes
          # green on an invariant nobody ran. Being noisily wrong beats being quietly wrong here,
          # so this stays until someone has a form that is precise AND fails closed.
          #
          # 1. Did the runner report this test at all? Deliberately broad, because the shapes are
          #    many: at --test-threads=1 libtest prints `test NAME ... ` before running, so this
          #    test's own inherited stderr lands between the name and the status word; a
          #    `- should panic` suffix or a module path shifts it further; nextest has its own
          #    vocabulary entirely. Matching the name rather than the outcome survives all of them.
          reported=$(grep -E '^test .*test_no_passthrough_e2e|^ *(PASS|FAIL|TRY|FLAKY|LEAK|SLOW|TIMEOUT).*test_no_passthrough_e2e([[:space:]]|$)' \
            "$RUNNER_TEMP/e6a3.log" || true)
          if [ -z "$reported" ]; then
            echo "::error::E6a.3 no-pass-through test did not run, so the invariant was never exercised. Either the test-outbound gate is misconfigured, or the test is skipped under a runner that reports skips without naming them (nextest counts them and moves on)."
            exit 1
          fi
          # 2. Was it reported as skipped? `#[ignore]` prints a result line and exits 0, so being
          #    reported is not the same as having executed. This is the routine answer to a flaky
          #    spawn-a-server test on the OS legs this step just added, and it has to be loud.
          case "$reported" in
            *ignored*)
              echo "::error::E6a.3 no-pass-through test was reported as ignored, not executed. The invariant was never exercised."
              exit 1
              ;;
          esac

      # Non-Linux: Exclude OS-specific crates (assay-monitor, assay-cli)
      # Windows/macOS automatically use bundled sqlite via cfg() in Cargo.toml
      - name: Test Workspace (Cross-Platform)
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace --exclude assay-ebpf --exclude assay-it --exclude assay-monitor --exclude assay-cli

  ebpf-smoke-ubuntu:
    name: eBPF monitor smoke (Linux - Ubuntu)
    needs: [scope, test]
    if: needs.scope.outputs.ebpf_smoke_required == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ebpf-smoke-ubuntu
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rust-src

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Switch Ubuntu Ports mirror with robust failover
          sudo bash scripts/ci/apt_ports_failover.sh

          # Install with strict flags (update already handled)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential libssl-dev pkg-config llvm-dev libclang-dev clang libsqlite3-dev

          scripts/ci/install-ebpf-toolchain.sh

      - name: Verify LSM blocking (CI Mode - Ubuntu soft skip)
        shell: bash
        env:
          STRICT_LSM_CHECK: "0"
        run: |
          set -euo pipefail
          chmod +x scripts/verify_lsm_docker.sh
          sudo -E env "PATH=$PATH" ./scripts/verify_lsm_docker.sh --ci-mode

      - name: Fix log permissions
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u)":"$(id -g)" /tmp/assay-lsm-verify || true
          ls -l /tmp/assay-lsm-verify || true

      - name: Cleanup verification logs (self-hosted)
        if: always()
        shell: bash
        run: |
          # Self-hosted lane does not upload these logs; remove aggressively to prevent disk exhaustion.
          sudo pkill -x assay 2>/dev/null || true
          sudo rm -rf /tmp/assay-lsm-verify /tmp/assay-test 2>/dev/null || true

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ci-smoke-logs-ubuntu
          path: /tmp/assay-lsm-verify/
          if-no-files-found: ignore


  ebpf-smoke-self-hosted:
    # ci-gate: not-required -- never runs on a pull request, by the `if:` below, so it has no
    # result to contribute on the event branch protection judges. ADR-043's consequences record
    # kernel validation running post-merge as consistent with its supporting status.
    name: eBPF monitor smoke (Linux - Self-Hosted)
    needs: [scope, test]
    if: github.event_name != 'pull_request' && needs.scope.outputs.self_hosted_ebpf_required == 'true'
    runs-on: [self-hosted, linux, assay-bpf-runner]
    timeout-minutes: 60
    concurrency:
      group: assay-bpf-runner-host
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    # Self-hosted runner has Rust in /opt/rust; jobs run with --noprofile so PATH can be minimal.
    # PATH only (no RUSTUP_HOME/CARGO_HOME): action finds existing rustup and does not try to install
    # into /opt/rust (runner user may not have write permission there).
    env:
      PATH: /opt/rust/bin:/usr/bin:/bin:$PATH
    steps:
      - name: Pre-clean workspace ownership
        shell: bash
        run: |
          # A stale host-side assay monitor can survive a prior failed run and interfere with
          # workspace cleanup or checkout. Clear it before touching the tree.
          sudo pkill -x assay 2>/dev/null || true

          # Remove target/ with sudo so checkout can delete workspace (avoids EPERM on root-owned fingerprints)
          sudo rm -rf "$GITHUB_WORKSPACE/target" 2>/dev/null || true
          sudo chattr -R -i "$GITHUB_WORKSPACE/.assay-test" 2>/dev/null || true
          sudo rm -rf "$GITHUB_WORKSPACE/.assay-test" /tmp/assay-lsm-verify /tmp/assay-test 2>/dev/null || true
          sudo chown -R "$(id -u)":"$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          sudo chown -R "$(id -u)":"$(id -g)" "$(dirname "$GITHUB_WORKSPACE")" 2>/dev/null || true

      # Workaround: self-hosted runner has root-owned _actions cache causing "Access denied"
      # during "Prepare all required actions". Use manual git clone to avoid any actions.
      - name: Checkout repository
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          if find . -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "ERROR: workspace not empty after pre-checkout cleanup"
            find . -mindepth 1 -maxdepth 2 -ls | sed -n '1,200p'
            exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            clone --depth 1 "https://github.com/${GH_REPO}.git" .
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch origin "${GH_SHA}"
          git checkout "${GH_SHA}"

      # rust-src: optional on host (eBPF build runs in Docker which has its own). Skip if rustup unavailable.
      - name: Install Rust toolchain (rust-src)
        shell: bash
        run: |
          export PATH="/opt/rust/bin:${HOME:-/home/github-runner}/.cargo/bin:${PATH}"
          rustup component add rust-src 2>/dev/null || echo "rustup not found, skipping (Docker build has rust-src)"

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Self-hosted runner: Rust in /opt/rust; cloud-init may symlink to /usr/local/bin
          export PATH="/opt/rust/bin:/usr/local/bin:${HOME:-/home/github-runner}/.cargo/bin:${PATH}"

          # Switch Ubuntu Ports mirror with robust failover
          set +e
          MIRRORS=(
            "https://mirror.gofoss.xyz/ubuntu-ports"
            "http://ports.ubuntu.com/ubuntu-ports"
          )

          switch_mirror() {
            local m="$1"
            # deb822 (24.04+)
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i \
                -e "s|http://ports.ubuntu.com/ubuntu-ports|${m}|g" \
                -e "s|https://ports.ubuntu.com/ubuntu-ports|${m}|g" \
                /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            fi
            # legacy
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i \
                -e "s|http://ports.ubuntu.com/ubuntu-ports|${m}|g" \
                -e "s|https://ports.ubuntu.com/ubuntu-ports|${m}|g" \
                /etc/apt/sources.list 2>/dev/null || true
            fi
          }

          apt_update() {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y \
              -o Acquire::Queue-Mode=access \
              -o Acquire::Retries=10 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o Acquire::https::Pipeline-Depth=0 \
              -o Acquire::CompressionTypes::Order::=gz \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Languages=none
          }

          ok=0
          for m in "${MIRRORS[@]}"; do
            echo "Trying Ubuntu Ports mirror: $m"
            switch_mirror "$m"
            if apt_update; then
              ok=1
              break
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "ERROR: apt-get update failed on all mirrors"
            exit 1
          fi
          set -e

          # Install with strict flags (update already handled)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential libssl-dev pkg-config llvm-dev libclang-dev clang libsqlite3-dev

          sudo chown -R "$(whoami)":"$(id -gn)" ~/.cargo || true
          scripts/ci/install-ebpf-toolchain.sh

      - name: Ensure Docker context excludes target
        shell: bash
        run: |
          # Avoid "can't stat .../target/..." when Docker builds (branches without .dockerignore, e.g. Dependabot pre-rebase)
          touch .dockerignore
          grep -q '^/target$' .dockerignore || echo '/target' >> .dockerignore

      - name: Verify LSM blocking (CI Mode - strict on self-hosted)
        shell: bash
        env:
          STRICT_LSM_CHECK: "1"
          # Use workspace path: self-hosted runner may deny writes to /tmp (Landlock etc.)
          ASSAY_TEST_DIR: ${{ github.workspace }}/.assay-test
        run: |
          set -euo pipefail
          # Prevent stale monitor state from previous runs from denying writes here.
          sudo pkill -x assay 2>/dev/null || true
          sudo chattr -R -i "$ASSAY_TEST_DIR" 2>/dev/null || true
          sudo rm -rf "$ASSAY_TEST_DIR" 2>/dev/null || true
          mkdir -p "$ASSAY_TEST_DIR"
          sudo chown -R "$(id -u)":"$(id -g)" "$ASSAY_TEST_DIR" 2>/dev/null || true
          echo "TOP SECRET DATA" > "$ASSAY_TEST_DIR/secret.txt"
          chmod +x scripts/verify_lsm_docker.sh
          sudo -E env "PATH=$PATH" "ASSAY_TEST_DIR=$ASSAY_TEST_DIR" ./scripts/verify_lsm_docker.sh --ci-mode

      - name: Fix log permissions
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u)":"$(id -g)" /tmp/assay-lsm-verify || true
          ls -l /tmp/assay-lsm-verify || true

  # Single job named "CI" so branch protection (required status check "CI") is satisfied.
  # Branch protection matches check run name; other jobs use descriptive names, this one reports "CI".
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [scope, deps-security, clippy, rustdoc, public-msrv, distribution-boundary, publish-shape-cli, public-crate-policy, vendored-packs, release-asset-contract, mcp-registry-foundation, perf, test, ebpf-smoke-ubuntu]
    permissions:
      contents: read
    steps:
      # This gate can only judge the jobs it was told to wait on, and for eleven weeks it was
      # told about two fewer than the workflow defined (#2230). The coverage guard reads the
      # membership off this file so a job added later is caught by construction rather than by
      # whoever remembers to widen the list.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify this gate waits on every gating job
        run: python3 scripts/ci/check-ci-gate-coverage.py

      - name: Evaluate required job results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          LIGHTWEIGHT_ONLY: ${{ needs.scope.outputs.lightweight_only }}
          DEPS_SECURITY_RESULT: ${{ needs.deps-security.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          RUSTDOC_RESULT: ${{ needs.rustdoc.result }}
          PUBLIC_MSRV_RESULT: ${{ needs.public-msrv.result }}
          DISTRIBUTION_BOUNDARY_RESULT: ${{ needs.distribution-boundary.result }}
          PUBLISH_SHAPE_CLI_RESULT: ${{ needs.publish-shape-cli.result }}
          PUBLIC_CRATE_POLICY_RESULT: ${{ needs.public-crate-policy.result }}
          VENDORED_PACKS_RESULT: ${{ needs.vendored-packs.result }}
          RELEASE_ASSET_CONTRACT_RESULT: ${{ needs.release-asset-contract.result }}
          MCP_REGISTRY_FOUNDATION_RESULT: ${{ needs.mcp-registry-foundation.result }}
          PERF_RESULT: ${{ needs.perf.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EBPF_SMOKE_REQUIRED: ${{ needs.scope.outputs.ebpf_smoke_required }}
          EBPF_SMOKE_UBUNTU_RESULT: ${{ needs.ebpf-smoke-ubuntu.result }}
          MCP_REGISTRY_TOUCHED: ${{ needs.scope.outputs.mcp_registry_touched }}
        shell: bash
        run: |
          set -euo pipefail

          # `skipped` used to be accepted unconditionally, and the two scope outputs the gate
          # imported were only echoed. A gate that never asks WHY a job was skipped cannot tell
          # "the classifier said this PR does not need it" from "the job's own `if:` broke and it
          # will never run again": both arrive as `skipped` and both read green. The sharpest
          # instance is `ebpf-smoke-ubuntu`, whose condition is the `== 'true'` form, so a typo in
          # the output name evaluates to `'' == 'true'` and disarms it silently and permanently.
          #
          # So each job is now paired with the condition under which it was expected to run, taken
          # from that job's own `if:`. Expected-to-run means `success`; only a job whose condition
          # was false may be `skipped`. `mcp_registry_touched` is imported for the first time here:
          # the gate needed three scope outputs to answer this question and had two.
          # Every one of these reads "only an explicit, expected value may relax the gate".
          #
          # The three outputs are not symmetric in the workflow: `lightweight_only` gates its jobs
          # with `!= 'true'` (a typo fails toward running, which is safe) while
          # `ebpf_smoke_required` and `mcp_registry_touched` use `== 'true'` (a typo fails toward
          # skipping, silently and permanently). So for the latter two an empty value IS the typo
          # signature, and treating empty as "not required" would let the gate fail open on exactly
          # the case it was written to catch. Only the literal "false" relaxes them; empty,
          # misspelled or missing means the run must show its work.
          if [[ "${LIGHTWEIGHT_ONLY}" == "true" ]]; then
            code_gated_expectation="optional"
          else
            code_gated_expectation="required"
          fi
          if [[ "${EBPF_SMOKE_REQUIRED}" == "false" ]]; then
            ebpf_expectation="optional"
          else
            ebpf_expectation="required"
          fi
          if [[ "${MCP_REGISTRY_TOUCHED}" == "false" ]]; then
            registry_expectation="optional"
          else
            registry_expectation="required"
          fi

          failures=0
          for triple in \
            "scope|${SCOPE_RESULT}|required" \
            "deps-security|${DEPS_SECURITY_RESULT}|${code_gated_expectation}" \
            "clippy|${CLIPPY_RESULT}|${code_gated_expectation}" \
            "rustdoc|${RUSTDOC_RESULT}|${code_gated_expectation}" \
            "public-msrv|${PUBLIC_MSRV_RESULT}|${code_gated_expectation}" \
            "distribution-boundary|${DISTRIBUTION_BOUNDARY_RESULT}|required" \
            "publish-shape-cli|${PUBLISH_SHAPE_CLI_RESULT}|required" \
            "public-crate-policy|${PUBLIC_CRATE_POLICY_RESULT}|required" \
            "vendored-packs|${VENDORED_PACKS_RESULT}|required" \
            "release-asset-contract|${RELEASE_ASSET_CONTRACT_RESULT}|required" \
            "mcp-registry-foundation|${MCP_REGISTRY_FOUNDATION_RESULT}|${registry_expectation}" \
            "perf|${PERF_RESULT}|${code_gated_expectation}" \
            "test|${TEST_RESULT}|${code_gated_expectation}" \
            "ebpf-smoke-ubuntu|${EBPF_SMOKE_UBUNTU_RESULT}|${ebpf_expectation}"
          do
            name="${triple%%|*}"
            rest="${triple#*|}"
            result="${rest%%|*}"
            expectation="${rest##*|}"

            case "${result}" in
              success)
                ;;
              skipped)
                if [[ "${expectation}" == "required" ]]; then
                  echo "::error::${name} was skipped, but this run required it to execute." \
                       "lightweight_only=${LIGHTWEIGHT_ONLY}" \
                       "ebpf_smoke_required=${EBPF_SMOKE_REQUIRED}" \
                       "mcp_registry_touched=${MCP_REGISTRY_TOUCHED}." \
                       "A job that never runs reports the same result as one deliberately not run;" \
                       "check that job's \`if:\` against the scope output it reads."
                  failures=$((failures + 1))
                fi
                ;;
              *)
                echo "::error::Required CI dependency ${name} ended with ${result}"
                failures=$((failures + 1))
                ;;
            esac
          done

          echo "lightweight_only=${LIGHTWEIGHT_ONLY}"
          echo "ebpf_smoke_required=${EBPF_SMOKE_REQUIRED}"
          echo "mcp_registry_touched=${MCP_REGISTRY_TOUCHED}"
          if (( failures > 0 )); then
            echo "${failures} required CI dependenc(ies) did not satisfy the gate."
            exit 1
          fi
          echo "All required CI jobs ran and passed; skipped jobs were scoped out."
