name: OTLP MCP Fixture Drift Report

# Non-required scheduled workflow that monitors the upstream OpenTelemetry SDK,
# OTLP proto definitions, MCP semconv, and generator for version drift.
# Drift findings are summary-only and non-required; they do not block required CI.
# Operational failure (network, missing lock file) may fail this informational run.

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-drift:
    name: Check Upstream Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Lock
        id: lock
        run: |
          set -euo pipefail
          LOCK_PATH="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0/upstream.lock.json"
          if [ ! -f "$LOCK_PATH" ]; then
            echo "Lock file not found at $LOCK_PATH"
            exit 1
          fi
          LOCKED_SDK=$(jq -r '.sdk.version' "$LOCK_PATH")
          LOCKED_EXPORTER=$(jq -r '.exporter.version' "$LOCK_PATH")
          echo "locked_sdk=$LOCKED_SDK" >> "$GITHUB_OUTPUT"
          echo "locked_exporter=$LOCKED_EXPORTER" >> "$GITHUB_OUTPUT"
          echo "Locked SDK: $LOCKED_SDK, Exporter: $LOCKED_EXPORTER"

      - name: Fetch Latest Versions
        id: latest
        run: |
          set -euo pipefail
          SDK_LATEST=$(npm view --silent @opentelemetry/sdk-trace-node version || echo "fetch_failed")
          EXPORTER_LATEST=$(npm view --silent @opentelemetry/exporter-trace-otlp-http version || echo "fetch_failed")
          echo "sdk=$SDK_LATEST" >> "$GITHUB_OUTPUT"
          echo "exporter=$EXPORTER_LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest SDK: $SDK_LATEST, Exporter: $EXPORTER_LATEST"

      - name: Check Proto Pin Integrity
        id: proto_pin
        run: |
          set -euo pipefail
          BASE="vendor/opentelemetry-proto-v1.11.0/opentelemetry/proto"
          CORPUS_ROOT="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0"
          PROTO_BASE_URL="https://raw.githubusercontent.com/open-telemetry/opentelemetry-proto/v1.11.0/opentelemetry/proto"

          DRIFT=false

          # Check trace_service.proto
          FILE="$CORPUS_ROOT/$BASE/collector/trace/v1/trace_service.proto"
          UPSTREAM_URL="$PROTO_BASE_URL/collector/trace/v1/trace_service.proto"
          if [ -f "$FILE" ]; then
            UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}')
            VENDORED=$(shasum -a 256 < "$FILE" | awk '{print $1}')
            if [ "$UPSTREAM" != "$VENDORED" ]; then DRIFT=true; fi
          else
            DRIFT=true
          fi

          # Check trace.proto
          FILE="$CORPUS_ROOT/$BASE/trace/v1/trace.proto"
          UPSTREAM_URL="$PROTO_BASE_URL/trace/v1/trace.proto"
          if [ -f "$FILE" ]; then
            UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}')
            VENDORED=$(shasum -a 256 < "$FILE" | awk '{print $1}')
            if [ "$UPSTREAM" != "$VENDORED" ]; then DRIFT=true; fi
          else
            DRIFT=true
          fi

          # Check resource.proto
          FILE="$CORPUS_ROOT/$BASE/resource/v1/resource.proto"
          UPSTREAM_URL="$PROTO_BASE_URL/resource/v1/resource.proto"
          if [ -f "$FILE" ]; then
            UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}')
            VENDORED=$(shasum -a 256 < "$FILE" | awk '{print $1}')
            if [ "$UPSTREAM" != "$VENDORED" ]; then DRIFT=true; fi
          else
            DRIFT=true
          fi

          # Check common.proto
          FILE="$CORPUS_ROOT/$BASE/common/v1/common.proto"
          UPSTREAM_URL="$PROTO_BASE_URL/common/v1/common.proto"
          if [ -f "$FILE" ]; then
            UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}')
            VENDORED=$(shasum -a 256 < "$FILE" | awk '{print $1}')
            if [ "$UPSTREAM" != "$VENDORED" ]; then DRIFT=true; fi
          else
            DRIFT=true
          fi

          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"

      - name: Check Proto Latest Release
        id: proto_latest
        run: |
          set -euo pipefail
          LATEST=$(curl --fail --retry 3 -sS https://api.github.com/repos/open-telemetry/opentelemetry-proto/releases/latest | jq -r '.tag_name')
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest opentelemetry-proto: $LATEST"

      - name: Check Semconv Pin Integrity
        id: semconv_pin
        run: |
          set -euo pipefail
          SEMCONV_FILE="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0/vendor/semantic-conventions-genai-434c91dc/mcp.md"
          COMMIT="434c91dcc34ed038e3048c07720ddfed2c6bddfc"
          UPSTREAM_URL="https://raw.githubusercontent.com/open-telemetry/semantic-conventions-genai/$COMMIT/docs/gen-ai/mcp.md"

          if [ ! -f "$SEMCONV_FILE" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}')
          VENDORED=$(shasum -a 256 < "$SEMCONV_FILE" | awk '{print $1}')

          if [ "$UPSTREAM" != "$VENDORED" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Semconv Latest Commit
        id: semconv_latest
        run: |
          set -euo pipefail
          LATEST=$(curl --fail --retry 3 -sS https://api.github.com/repos/open-telemetry/semantic-conventions-genai/commits/main | jq -r '.sha')
          echo "commit=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest semantic-conventions-genai commit: $LATEST"

      - name: Report to Summary
        env:
          LOCKED_SDK: ${{ steps.lock.outputs.locked_sdk }}
          LOCKED_EXPORTER: ${{ steps.lock.outputs.locked_exporter }}
          LATEST_SDK: ${{ steps.latest.outputs.sdk }}
          LATEST_EXPORTER: ${{ steps.latest.outputs.exporter }}
          PROTO_DRIFT: ${{ steps.proto_pin.outputs.drift }}
          PROTO_LATEST_TAG: ${{ steps.proto_latest.outputs.tag }}
          SEMCONV_DRIFT: ${{ steps.semconv_pin.outputs.drift }}
          SEMCONV_LATEST_COMMIT: ${{ steps.semconv_latest.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo "# OTLP MCP Fixture Drift Report"
            echo ""
            echo "**Run Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            # SDK
            if [ "$LOCKED_SDK" != "$LATEST_SDK" ]; then
              echo "## SDK Drift Detected"
              echo ""
              echo "- Locked: \`$LOCKED_SDK\`"
              echo "- Latest: \`$LATEST_SDK\`"
              echo ""
            else
              echo "## SDK: No Drift (\`$LOCKED_SDK\`)"
              echo ""
            fi

            # Exporter
            if [ "$LOCKED_EXPORTER" != "$LATEST_EXPORTER" ]; then
              echo "## Exporter Drift Detected"
              echo ""
              echo "- Locked: \`$LOCKED_EXPORTER\`"
              echo "- Latest: \`$LATEST_EXPORTER\`"
              echo ""
            else
              echo "## Exporter: No Drift (\`$LOCKED_EXPORTER\`)"
              echo ""
            fi

            # Proto Pin Integrity
            if [ "$PROTO_DRIFT" = "true" ]; then
              echo "## Proto Pin Integrity: DRIFT DETECTED"
              echo ""
              echo "One or more proto files differ from pinned v1.11.0."
              echo ""
            else
              echo "## Proto Pin Integrity: OK (v1.11.0)"
              echo ""
            fi

            # Proto Latest Release
            echo "## Proto Latest Release"
            echo ""
            echo "- Pinned: \`v1.11.0\`"
            echo "- Latest: \`$PROTO_LATEST_TAG\`"
            echo ""

            # Semconv Pin Integrity
            if [ "$SEMCONV_DRIFT" = "true" ]; then
              echo "## Semconv Pin Integrity: DRIFT DETECTED"
              echo ""
              echo "Vendored MCP semconv differs from pinned commit 434c91dc."
              echo ""
            else
              echo "## Semconv Pin Integrity: OK (434c91dc)"
              echo ""
            fi

            # Semconv Latest Commit
            echo "## Semconv Latest Commit"
            echo ""
            echo "- Pinned: \`434c91dcc34ed038e3048c07720ddfed2c6bddfc\`"
            echo "- Latest: \`$SEMCONV_LATEST_COMMIT\`"
            echo ""

            # Overall
            echo "## Status"
            echo ""
            echo "Drift findings are summary-only and non-required. They do not block required CI."
            echo "Operational failure (network, API) may fail this informational run."
          } >> "$GITHUB_STEP_SUMMARY"
