name: OTLP MCP Fixture Drift Report

# Non-required scheduled workflow that monitors the upstream OpenTelemetry SDK,
# OTLP proto definitions, MCP semconv, and generator for version drift.
# Drift findings are summary-only and non-required; they do not block required CI.
#
# All pinned versions, tags, commits, and paths are read from upstream.lock.json
# (single source of truth). No pins are duplicated in this workflow.
#
# Network/npm fetch failure is treated as an unknown operational failure
# (exit 1), never as detected drift.

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-drift:
    name: Check Upstream Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Lock
        id: lock
        run: |
          set -euo pipefail
          LOCK_PATH="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0/upstream.lock.json"
          if [ ! -f "$LOCK_PATH" ]; then
            echo "Lock file not found at $LOCK_PATH"
            exit 1
          fi

          # SDK/exporter pins
          LOCKED_SDK=$(jq -r '.sdk.version' "$LOCK_PATH")
          LOCKED_SDK_PKG=$(jq -r '.sdk.package' "$LOCK_PATH")
          LOCKED_EXPORTER=$(jq -r '.exporter.version' "$LOCK_PATH")
          LOCKED_EXPORTER_PKG=$(jq -r '.exporter.package' "$LOCK_PATH")

          # Proto pin: read from upstream_sources where type=proto
          PROTO_TAG=$(jq -r '.upstream_sources[] | select(.type=="proto") | .tag' "$LOCK_PATH")

          # Semconv pin: read from upstream_sources where type=semconv
          SEMCONV_COMMIT=$(jq -r '.upstream_sources[] | select(.type=="semconv") | .commit' "$LOCK_PATH")

          {
            echo "locked_sdk=$LOCKED_SDK"
            echo "locked_sdk_pkg=$LOCKED_SDK_PKG"
            echo "locked_exporter=$LOCKED_EXPORTER"
            echo "locked_exporter_pkg=$LOCKED_EXPORTER_PKG"
            echo "proto_tag=$PROTO_TAG"
            echo "semconv_commit=$SEMCONV_COMMIT"
          } >> "$GITHUB_OUTPUT"

          echo "Locked SDK: $LOCKED_SDK_PKG@$LOCKED_SDK"
          echo "Locked Exporter: $LOCKED_EXPORTER_PKG@$LOCKED_EXPORTER"
          echo "Locked Proto: $PROTO_TAG"
          echo "Locked Semconv: ${SEMCONV_COMMIT:0:8}"

      - name: Fetch Latest Versions
        id: latest
        run: |
          set -euo pipefail
          SDK_PKG="${{ steps.lock.outputs.locked_sdk_pkg }}"
          EXPORTER_PKG="${{ steps.lock.outputs.locked_exporter_pkg }}"

          # Fetch latest versions from npm; fail the step on network error
          # (operational failure, not drift)
          SDK_LATEST=$(npm view --silent "$SDK_PKG" version) || {
            echo "::error::npm fetch failed for $SDK_PKG (operational failure, not drift)"
            exit 1
          }
          EXPORTER_LATEST=$(npm view --silent "$EXPORTER_PKG" version) || {
            echo "::error::npm fetch failed for $EXPORTER_PKG (operational failure, not drift)"
            exit 1
          }
          echo "sdk=$SDK_LATEST" >> "$GITHUB_OUTPUT"
          echo "exporter=$EXPORTER_LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest SDK: $SDK_LATEST, Exporter: $EXPORTER_LATEST"

      - name: Check Proto Pin Integrity
        id: proto_pin
        run: |
          set -euo pipefail
          LOCK_PATH="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0/upstream.lock.json"
          CORPUS_ROOT="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0"
          PROTO_TAG="${{ steps.lock.outputs.proto_tag }}"
          PROTO_RAW_BASE="https://raw.githubusercontent.com/open-telemetry/opentelemetry-proto/${PROTO_TAG}"

          DRIFT=false

          # Iterate locked proto files from upstream.lock.json
          FILE_COUNT=$(jq -r '.upstream_sources[] | select(.type=="proto") | .files | length' "$LOCK_PATH")
          echo "Checking $FILE_COUNT proto files from lock..."

          for i in $(seq 0 $((FILE_COUNT - 1))); do
            SOURCE_PATH=$(jq -r ".upstream_sources[] | select(.type==\"proto\") | .files[$i].source_path" "$LOCK_PATH")
            VENDORED_PATH=$(jq -r ".upstream_sources[] | select(.type==\"proto\") | .files[$i].vendored_path" "$LOCK_PATH")

            FILE="$CORPUS_ROOT/$VENDORED_PATH"
            UPSTREAM_URL="$PROTO_RAW_BASE/$SOURCE_PATH"
            echo "  Checking $SOURCE_PATH..."

            if [ -f "$FILE" ]; then
              UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}') || {
                echo "::error::curl failed for $UPSTREAM_URL (operational failure, not drift)"
                exit 1
              }
              VENDORED=$(shasum -a 256 < "$FILE" | awk '{print $1}')
              if [ "$UPSTREAM" != "$VENDORED" ]; then DRIFT=true; fi
            else
              DRIFT=true
            fi
          done

          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"

      - name: Check Proto Latest Release
        id: proto_latest
        run: |
          set -euo pipefail
          LATEST=$(curl --fail --retry 3 -sS https://api.github.com/repos/open-telemetry/opentelemetry-proto/releases/latest | jq -r '.tag_name') || {
            echo "::error::GitHub API fetch failed (operational failure, not drift)"
            exit 1
          }
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest opentelemetry-proto: $LATEST"

      - name: Check Semconv Pin Integrity
        id: semconv_pin
        run: |
          set -euo pipefail
          LOCK_PATH="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0/upstream.lock.json"
          CORPUS_ROOT="crates/assay-core/tests/fixtures/otel-mcp-ingest-v0"
          SEMCONV_COMMIT="${{ steps.lock.outputs.semconv_commit }}"

          # Read semconv file paths from lock
          VENDORED_PATH=$(jq -r '.upstream_sources[] | select(.type=="semconv") | .files[0].vendored_path' "$LOCK_PATH")
          SOURCE_PATH=$(jq -r '.upstream_sources[] | select(.type=="semconv") | .files[0].source_path' "$LOCK_PATH")
          SEMCONV_FILE="$CORPUS_ROOT/$VENDORED_PATH"
          UPSTREAM_URL="https://raw.githubusercontent.com/open-telemetry/semantic-conventions-genai/$SEMCONV_COMMIT/$SOURCE_PATH"

          if [ ! -f "$SEMCONV_FILE" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM=$(curl --fail --retry 3 -sS "$UPSTREAM_URL" | shasum -a 256 | awk '{print $1}') || {
            echo "::error::curl failed for semconv upstream (operational failure, not drift)"
            exit 1
          }
          VENDORED=$(shasum -a 256 < "$SEMCONV_FILE" | awk '{print $1}')

          if [ "$UPSTREAM" != "$VENDORED" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Semconv Latest Commit
        id: semconv_latest
        run: |
          set -euo pipefail
          LATEST=$(curl --fail --retry 3 -sS https://api.github.com/repos/open-telemetry/semantic-conventions-genai/commits/main | jq -r '.sha') || {
            echo "::error::GitHub API fetch failed (operational failure, not drift)"
            exit 1
          }
          echo "commit=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest semantic-conventions-genai commit: $LATEST"

      - name: Report to Summary
        env:
          LOCKED_SDK: ${{ steps.lock.outputs.locked_sdk }}
          LOCKED_EXPORTER: ${{ steps.lock.outputs.locked_exporter }}
          LATEST_SDK: ${{ steps.latest.outputs.sdk }}
          LATEST_EXPORTER: ${{ steps.latest.outputs.exporter }}
          PROTO_DRIFT: ${{ steps.proto_pin.outputs.drift }}
          PROTO_TAG: ${{ steps.lock.outputs.proto_tag }}
          PROTO_LATEST_TAG: ${{ steps.proto_latest.outputs.tag }}
          SEMCONV_DRIFT: ${{ steps.semconv_pin.outputs.drift }}
          SEMCONV_COMMIT: ${{ steps.lock.outputs.semconv_commit }}
          SEMCONV_LATEST_COMMIT: ${{ steps.semconv_latest.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo "# OTLP MCP Fixture Drift Report"
            echo ""
            echo "**Run Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            # SDK
            if [ "$LOCKED_SDK" != "$LATEST_SDK" ]; then
              echo "## SDK Drift Detected"
              echo ""
              echo "- Locked: \`$LOCKED_SDK\`"
              echo "- Latest: \`$LATEST_SDK\`"
              echo ""
            else
              echo "## SDK: No Drift (\`$LOCKED_SDK\`)"
              echo ""
            fi

            # Exporter
            if [ "$LOCKED_EXPORTER" != "$LATEST_EXPORTER" ]; then
              echo "## Exporter Drift Detected"
              echo ""
              echo "- Locked: \`$LOCKED_EXPORTER\`"
              echo "- Latest: \`$LATEST_EXPORTER\`"
              echo ""
            else
              echo "## Exporter: No Drift (\`$LOCKED_EXPORTER\`)"
              echo ""
            fi

            # Proto Pin Integrity
            if [ "$PROTO_DRIFT" = "true" ]; then
              echo "## Proto Pin Integrity: DRIFT DETECTED"
              echo ""
              echo "One or more proto files differ from pinned $PROTO_TAG."
              echo ""
            else
              echo "## Proto Pin Integrity: OK ($PROTO_TAG)"
              echo ""
            fi

            # Proto Latest Release
            echo "## Proto Latest Release"
            echo ""
            echo "- Pinned: \`$PROTO_TAG\`"
            echo "- Latest: \`$PROTO_LATEST_TAG\`"
            echo ""

            # Semconv Pin Integrity
            if [ "$SEMCONV_DRIFT" = "true" ]; then
              echo "## Semconv Pin Integrity: DRIFT DETECTED"
              echo ""
              echo "Vendored MCP semconv differs from pinned commit ${SEMCONV_COMMIT:0:8}."
              echo ""
            else
              echo "## Semconv Pin Integrity: OK (${SEMCONV_COMMIT:0:8})"
              echo ""
            fi

            # Semconv Latest Commit
            echo "## Semconv Latest Commit"
            echo ""
            echo "- Pinned: \`$SEMCONV_COMMIT\`"
            echo "- Latest: \`$SEMCONV_LATEST_COMMIT\`"
            echo ""

            # Overall
            echo "## Status"
            echo ""
            echo "Drift findings are summary-only and non-required. They do not block required CI."
            echo "Network/npm fetch failures fail as operational errors, never as drift."
          } >> "$GITHUB_STEP_SUMMARY"
