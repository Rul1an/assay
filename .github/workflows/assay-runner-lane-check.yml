name: Assay-Runner Lane Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: ["Runner Spike Delegated"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to classify"
        required: true
        type: number
      override_reason:
        description: >-
          Record that verification could not be performed, and why. Credits the
          PR without a proof pack. Honoured only on this privileged dispatch,
          which runs from main and requires write access, so the decision is
          attributable to the actor who made it.
        required: false
        type: string
      expected_head_sha:
        description: "Expected PR head SHA"
        required: false
        type: string

permissions: {}

jobs:
  lane-check:
    name: lane-check
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # pull_request: the PR base, so a PR can never run its own edited
          #   gatekeeper. workflow_dispatch: main, because the privileged
          #   refresh holds statuses: write and must never execute helper code
          #   from the dispatched ref (which a PR author controls); the head
          #   SHA is data, not code. workflow_run: github.sha is the default
          #   branch head, already trusted.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main' || github.sha) }}

      - name: Verify lane-check helper exists
        shell: bash
        run: test -f scripts/ci/assay_runner_lane_check.py

      - name: Self-test lane classifier
        shell: bash
        run: python3 scripts/ci/assay_runner_lane_check.py --self-test

      - name: Resolve PR number
        id: pr
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "pr_number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              python3 scripts/ci/assay_runner_lane_check.py --resolve-pr-from-event >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check PR delegated lane proof
        if: steps.pr.outputs.pr_number != ''
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          # Only from workflow_dispatch. A pull_request run has no inputs, so a
          # PR cannot set this for itself.
          LANE_OVERRIDE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.override_reason || '' }}
          LANE_OVERRIDE_ACTOR: ${{ github.event_name == 'workflow_dispatch' && github.actor || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          DELEGATED_WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
            if [[ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "dispatched lane-check head ${GITHUB_SHA} does not match expected ${EXPECTED_HEAD_SHA}" >&2
              exit 2
            fi
            pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [[ "$pr_head" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "PR #${PR_NUMBER} moved from ${EXPECTED_HEAD_SHA} to ${pr_head}" >&2
              exit 2
            fi
          fi
          args=(--comment)
          if python3 scripts/ci/assay_runner_lane_check.py --help | grep -q -- "--status"; then
            args+=(--status)
          fi
          python3 scripts/ci/assay_runner_lane_check.py "${args[@]}"

      - name: No associated PR for delegated run
        if: github.event_name == 'workflow_run' && steps.pr.outputs.pr_number == ''
        shell: bash
        run: echo "No associated pull request found for delegated workflow_run; nothing to refresh."
