name: Auto-Update Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no code changes"
        required: false
        default: false
        type: boolean

concurrency:
  group: docs-auto-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-docs:
    name: Generate Docs & Diagrams
    runs-on: ubuntu-latest
    # Only run on main repo, not forks
    if: github.repository == 'Rul1an/assay'
    permissions:
      actions: write # dispatch the canonical required-check workflows
      contents: write # create-pull-request commits docs changes to docs/auto-update
      pull-requests: write # create and auto-merge the generated docs PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # Full history for changelog

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate crate dependency diagram
        run: |
          chmod +x scripts/docs/generate-crate-deps.sh
          scripts/docs/generate-crate-deps.sh

      - name: Generate module map
        run: |
          chmod +x scripts/docs/generate-module-map.sh
          scripts/docs/generate-module-map.sh

      - name: Update architecture diagrams
        run: |
          chmod +x scripts/docs/update-architecture-docs.sh
          scripts/docs/update-architecture-docs.sh

      - name: Update changelog (from recent PRs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/docs/update-changelog.sh
          scripts/docs/update-changelog.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Requires repo Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" enabled
      - name: Create Pull Request
        id: create_pr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-update diagrams and crate info"
          title: "docs: auto-update diagrams and crate info"
          body: |
            ## Automated Documentation Update

            This PR was automatically generated after a merge to main.

            ### Changes
            - Updated crate dependency diagram
            - Updated module structure map
            - Updated version info in code-map.md
            - Added changelog entries for recent PRs

            ---
            *Generated by [docs-auto-update.yml](.github/workflows/docs-auto-update.yml)*
          branch: docs/auto-update
          add-paths: |
            docs/**
          delete-branch: true
          labels: documentation,automated

      - name: Reconcile existing docs PR with main
        id: reconcile_pr
        env:
          EXPECTED_BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/reconcile-docs-auto-pr.sh

      - name: Dispatch required workflows for reconciled docs head
        if: >-
          steps.reconcile_pr.outputs.pr_number != '' &&
          (steps.changes.outputs.has_changes == 'true' ||
          steps.reconcile_pr.outputs.branch_updated == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_update))
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: docs/auto-update
          EXPECTED_HEAD_SHA: ${{ steps.reconcile_pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.reconcile_pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml \
            --repo "$REPO" \
            --ref "$BRANCH" \
            -f "pr_number=${PR_NUMBER}" \
            -f "expected_head_sha=${EXPECTED_HEAD_SHA}"
          gh workflow run assay-runner-lane-check.yml \
            --repo "$REPO" \
            --ref "$BRANCH" \
            -f "pr_number=${PR_NUMBER}" \
            -f "expected_head_sha=${EXPECTED_HEAD_SHA}"
          gh workflow run host-capability-check.yml \
            --repo "$REPO" \
            --ref "$BRANCH" \
            -f "pr_number=${PR_NUMBER}" \
            -f "expected_head_sha=${EXPECTED_HEAD_SHA}"

      - name: Enable auto-merge for docs PR
        if: steps.reconcile_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_PR_NUMBER: ${{ steps.reconcile_pr.outputs.pr_number }}
        run: gh pr merge "$CREATED_PR_NUMBER" --auto --squash
