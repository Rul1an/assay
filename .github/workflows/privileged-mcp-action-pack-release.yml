name: Publish Privileged MCP Action clean-room pack

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privileged-mcp-action-pack
  cancel-in-progress: false

jobs:
  release-pack:
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Re-runs retain the original workflow SHA. Pinning the checkout to it keeps a
          # partially published candidate recoverable after main advances.
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.8"

      - name: Validate candidate release contract
        id: candidate
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release controller must be dispatched from main, got $GITHUB_REF" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "checked-out main does not match the workflow source commit" >&2
            exit 2
          fi
          python3 \
            conformance/privileged-mcp-action-v0/scripts/validate_candidate_release.py \
            --candidate conformance/privileged-mcp-action-v0/candidate-release.json \
            --manifest conformance/privileged-mcp-action-v0/MANIFEST.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Build deterministic pack
        run: |
          set -euo pipefail
          mkdir -p release
          source_commit="$(git rev-parse HEAD)"
          builder=conformance/privileged-mcp-action-v0/scripts/build_clean_room_pack.py
          python3 "$builder" \
            --repo-root . \
            --source-commit "$source_commit" \
            --output release/privileged-mcp-action-v0-clean-room.tar.gz
          python3 "$builder" \
            --repo-root . \
            --source-commit "$source_commit" \
            --output /tmp/pack-second.tar.gz
          cmp release/privileged-mcp-action-v0-clean-room.tar.gz /tmp/pack-second.tar.gz
          (
            cd release
            sha256sum privileged-mcp-action-v0-clean-room.tar.gz > SHA256SUMS
          )

      - name: Run pack contract tests
        run: |
          set -euo pipefail
          python3 -m unittest \
            conformance/privileged-mcp-action-v0/tests/test_activation_kit.py

      - name: Build the reference verifier for a transformation check
        run: |
          cargo test -p assay-cli --test conformance_privileged_mcp_action

      - name: Prove released rendering preserves all normative outcomes
        uses: ./.github/actions/privileged-mcp-action-conformance
        with:
          pack: release/privileged-mcp-action-v0-clean-room.tar.gz
          entrypoint: ${{ github.workspace }}/target/debug/assay evidence verify-privileged-mcp-action --format json
          implementation-name: Assay reference verifier (transformation check only)
          implementation-source: ${{ github.server_url }}/${{ github.repository }}
          implementation-commit: ${{ github.sha }}
          reproduction-mode: other_disclosed
          report: /tmp/reference-transformation-check.json

      - name: Check released transformation summary
        run: |
          python3 \
            conformance/privileged-mcp-action-v0/scripts/validate_run_record.py \
            /tmp/reference-transformation-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/reference-transformation-check.json").read_text())
          # Read from the corpus, not written out here: this job is the candidate-release path,
          # so a stale literal blocks exactly the release that a corpus change needs.
          manifest = json.loads(
              Path("conformance/privileged-mcp-action-v0/MANIFEST.json").read_text()
          )
          case_count = len(manifest["vectors"])
          expected = {
              "execution_error": 0,
              "harness_error": 0,
              "match": case_count,
              "mismatch": 0,
              "review_warnings": 0,
              "total": case_count,
          }
          if report["summary"] != expected:
              raise SystemExit(f"unexpected transformation summary: {report['summary']}")
          PY

      - name: Attest release pack
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
          show-summary: true

      - name: Retain attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" release/attestation-bundle.json

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
              echo "existing release tag is not annotated: $TAG" >&2
              exit 2
            fi
            if [[ "$(git rev-parse "refs/tags/$TAG^{}")" != "$SOURCE_COMMIT" ]]; then
              echo "existing release tag does not name $SOURCE_COMMIT: $TAG" >&2
              exit 2
            fi
          else
            tag_object="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
                -f tag="$TAG" \
                -f message="Privileged MCP Action v0 clean-room conformance candidate ${TAG##*.}" \
                -f object="$SOURCE_COMMIT" \
                -f type=commit \
                --jq .sha
            )"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$tag_object"
          fi
          gh release create "$TAG" \
            release/privileged-mcp-action-v0-clean-room.tar.gz \
            release/SHA256SUMS \
            release/attestation-bundle.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Privileged MCP Action v0 clean-room conformance pack" \
            --notes "Inputs-only pack for implementing privileged-mcp-action/v0 from the pinned profile commit. The asset omits expected outcomes and Assay implementation code. See the conformance protocol at the release tag for the claim ceiling."
