name: Assay Gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  assay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve Assay release tag
        id: assay_tag
        run: bash scripts/ci/read-assay-release-tag.sh

      - name: Setup Assay
        uses: Rul1an/assay-action@184720a5cb051ebc2c1de7e52b113aa973f2c374
        with:
          version: ${{ steps.assay_tag.outputs.version }}

      - name: Run Assay CI
        run: assay ci --config ci-eval.yaml --trace-file traces/ci.jsonl --strict
