name: Verifier Fuzz Smoke

# ADR-043 §3: the evidence-chain verifier is the primary fuzz target, and a target that exists but
# never runs in CI does not satisfy that invariant. This lane is deliberately a smoke test, not a
# campaign: a fixed run and time budget on a PR, a longer nightly pass on a schedule. The semantic
# oracle is not here -- it lives in the deterministic property tests, which run in required CI on
# every PR. This lane answers one narrower question: does the target crash, hang, or exceed its
# own resource ceilings on inputs nobody wrote down.
#
# Besides the verifier (`bundle_reader`), the matrix runs the MCP stdio JSON-RPC line handler
# (`mcp_jsonrpc`, issue #2914: silence, id echo, and response-size invariants over the same
# `handle_line` the server loop calls), the `tools/call` decision inputs (`tool_call_decision`:
# envelope classification, production `handle_call` evaluation, and the privileged-action
# classifier, asserting totality and determinism), and the incident-package verifier
# (`incident_package`: raw outer-archive bytes under the default relying-party context, the
# #3345 combined-session context and the attestation context that selects the test key,
# asserting determinism and SPEC §7.4 outcome/reason pairing). Coverage of `bundle_reader` does not count for that format. Every target gets
# the same PR/nightly budgets below.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/assay-evidence/**"
      # `assay-core` is a direct fuzz dependency, and the root manifest carries the workspace
      # version every path dep inherits. Without these two, a release bump touches neither
      # `fuzz/**` nor `crates/assay-evidence/**`, so the lock silently goes stale exactly the way
      # it did before -- and the staleness assertion then fails on whatever unrelated PR next
      # touches this lane, misattributing the break to whoever happened to be passing.
      - "crates/assay-core/**"
      # The rest of the local graph `cargo metadata --locked` resolves in `fuzz/`. Naming only the
      # two obvious crates left three uncovered, so a change in any of them could alter code,
      # manifest or lock without this lane running. `scripts/ci/test-fuzz-lane-contract.sh` derives
      # this set from `fuzz/Cargo.lock` and fails when it drifts, rather than trusting this list.
      - "crates/assay-adapter-api/**"
      - "crates/assay-canonical/**"
      - "crates/assay-common/**"
      - "crates/assay-mcp-server/**"
      - "crates/assay-metrics/**"
      - "crates/assay-runner-schema/**"
      - "Cargo.toml"
      - ".github/workflows/fuzz-smoke.yml"
  schedule:
    # Nightly, longer budget. Off the PR path so a slow campaign never gates a merge.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

env:
  # One source of truth for the toolchain: the install step and the run step must not be able to
  # disagree, which is exactly how a dated pin gets bypassed.
  # Bumped from nightly-2026-07-24, which ICEs building tokio 1.53.1 under cargo-fuzz's sanitizer
  # flags: `rustc_codegen_ssa/src/mir/operand.rs:291: not immediate: OperandRef(Uninit ...)`.
  # Reproduced locally on aarch64-apple-darwin with the same rustc commit, so it is the toolchain
  # and not the runner. `cargo check` cannot see it — no sanitizer instrumentation — which is why
  # the pin is only moved after a real `cargo fuzz run` on the candidate.
  #
  # Verified on this exact combination before pinning: `cargo check --locked --all-targets` in
  # `fuzz/`, and `cargo fuzz run bundle_reader` with the CI parameters (20000 runs, 14s, 776 new
  # units, peak RSS 412 MB, no crash).
  FUZZ_TOOLCHAIN: nightly-2026-07-28
  # The cargo-fuzz release this lane runs. One name for the cache key, the install and the version
  # check, so a bump cannot restore the previous binary under the new number.
  CARGO_FUZZ_VERSION: "0.13.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: ${{ matrix.target }} (fuzz smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [bundle_reader, mcp_jsonrpc, tool_call_decision, incident_package]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # setup-rust installs the FUZZ_TOOLCHAIN pin then restores the fuzz workspace cache.
      # Prior layout already placed cache immediately after toolchain with no steps between;
      # the composite keeps that pair. This migration does not claim ordering equivalence for
      # lanes that had apt or other work between those two steps (this lane did not).
      - uses: ./.github/actions/setup-rust
        with:
          # Date-pinned, not floating `nightly`. Pinning cargo-fuzz alone does not freeze the
          # compiler that produced a reported run, and a sanitizer-instrumented build is exactly
          # the kind of thing that changes between nightlies. Bumping this is a deliberate commit.
          #
          # The run step must select this exact name. `cargo +nightly` asks rustup for the channel
          # alias, which resolves to the newest nightly and will install one if it is missing --
          # silently defeating the pin while the log still says the dated toolchain was installed.
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          cache-workspaces: fuzz -> target

      # The tool binary is cached on its own, keyed by its exact version and the runner platform.
      # Compiling it from crates.io in every job put a registry download on the path of every
      # fuzz run: one failed crate download in one matrix leg cost that target its nightly pass.
      # No restore-keys: a looser key could hand this job another version's binary.
      - name: Restore cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        # Version-pinned, not just `--locked`: `--locked` fixes the tool's dependencies but still
        # installs whatever cargo-fuzz release is current, so the lane could change behaviour
        # without a commit here.
        #
        # Only on a cache miss, and with a bounded retry: the registry is the one thing this step
        # depends on that the repository does not control. Cargo's own error stays in the log for
        # every failed attempt.
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"; then
              exit 0
            fi
            echo "::warning::cargo install cargo-fuzz failed (attempt ${attempt} of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::cargo install cargo-fuzz ${CARGO_FUZZ_VERSION} failed three times; inspect the Cargo errors above"
          exit 1

      - name: Check the cargo-fuzz version
        # On every job, restored or freshly installed: a cached file named cargo-fuzz is trusted
        # for what it reports, not for where it was found.
        shell: bash
        run: |
          set -euo pipefail
          found="$(cargo fuzz --version)"
          if [[ "${found}" != "cargo-fuzz ${CARGO_FUZZ_VERSION}" ]]; then
            echo "::error::expected cargo-fuzz ${CARGO_FUZZ_VERSION}, found: ${found}"
            exit 1
          fi

      - name: Assert the seed corpus is intact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # An empty corpus turns this lane into a build check, which ADR-043 §3 says is not
          # sufficient. Names rather than a count: a count stays green when a seed is replaced by
          # an unrelated file, and the expansion seed in particular is the only one that reaches
          # the decompression path at all.
          case "${TARGET}" in
            bundle_reader)
              required=(
                valid-single-event
                valid-three-events
                truncated-half
                truncated-gzip-header
                payload-mutated
                digest-mutated
                run-root-mutated
                duplicate-member
                unexpected-member
                manifest-only
                wrong-member-order
                oversize-line
                high-ratio-gzip
                pax-header-past-decode-ceiling
              )
              ;;
            mcp_jsonrpc)
              # Frames from the outer-fallback contract: every notification
              # shape, id:null, all three request-member duplicate probes plus
              # the escape-spelled duplicate id, a duplicate of an ignored
              # unknown member (must stay answered), the oversize refusal, and
              # the envelope faults. Dropping one silently narrows the oracle.
              required=(
                valid-initialize
                valid-tools-list
                valid-tools-call
                bad-initialize
                notification-unknown-method
                notification-cancelled
                notification-initialized
                notification-version-mismatch
                id-null
                duplicate-method
                duplicate-params
                duplicate-id
                duplicate-id-escape
                duplicate-unknown-member
                oversize-line
                invalid-json
                empty-line
                unknown-method
                version-refused
                malformed-tools-call
                unknown-tool
              )
              ;;
            tool_call_decision)
              required=(
                valid-check-args
                valid-policy-decide
                unknown-tool
                malformed-scalar
                malformed-text
                malformed-missing-name
                malformed-name-type
                malformed-args-type
                default-arguments
                hostile-name
                envelope-with-on-error
                direct-deploy-key
                direct-slack-invite
                direct-workspace-admin
                direct-secret-args
                direct-unknown-tool
                direct-scalar-args
                eval-allow
                eval-deny
                eval-error
              )
              ;;
            incident_package)
              # Byte-identical copies of every incident-package fixture tar.
              # Dropping one silently narrows the phases the smoke corpus reaches.
              required=(
                valid-five-surfaces
                valid-present-empty
                combined-session-3345
                refusal-p2-input-shape
                refusal-p3-unknown-format
                refusal-p4-digest
                refusal-p5-locator
                refusal-p6-trust-input
                refusal-p7-disclosure
                refusal-p8-cap1-rules
                refusal-p9-claim-boundary
                refusal-p11-stale-assessment
                ordering-p3-unknown-format-and-p4-digest
                ordering-p4-digest-and-p11-stale
                ordering-p8-cap1-rules-and-p11-stale
                attestation-verified
              )
              ;;
          esac
          missing=0
          for seed in "${required[@]}"; do
            if [ ! -s "fuzz/corpus/${TARGET}/${seed}" ]; then
              echo "::error::missing or empty seed: ${TARGET}/${seed}"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1
          echo "seeds=${#required[@]} present"

      - name: Fuzz smoke
        shell: bash
        env:
          # Matrix leg as plain env: the lane-contract harness executes this
          # script with mocked cargo, where a GitHub `${{ }}` expression is a
          # bash bad-substitution failure before the guard ever runs.
          TARGET: ${{ matrix.target }}
          # PR budget stays small so the lane is advisory-fast; the nightly run gets the longer one.
          RUNS: ${{ github.event_name == 'schedule' && '200000' || '20000' }}
          MAX_TOTAL_TIME: ${{ github.event_name == 'schedule' && '900' || '120' }}
        run: |
          set -euo pipefail
          # The first corpus directory is libFuzzer's *output* corpus and the second is a read-only
          # input. Pointing the output at a scratch directory keeps generated units out of the
          # working tree, so a CI run can never quietly grow the checked-in corpus.
          mkdir -p "${RUNNER_TEMP}/fuzz-out"
          # The JSON-RPC line domain is single lines: cap inputs above the
          # largest seed that must load (the 5 KB oversize line). bundle_reader
          # keeps its 1 MiB ceiling for the bundle format it parses.
          case "${TARGET}" in
            bundle_reader) MAX_LEN=1048576 ;;
            mcp_jsonrpc | tool_call_decision) MAX_LEN=16384 ;;
            # 65536 fits combined_session_3345.tar (58368 bytes) with headroom so
            # libFuzzer loads every seed unclipped. The bound contexts keep HARD
            # outer_bytes (256 MiB); this cap is the fuzzer's, not a context overlay.
            incident_package) MAX_LEN=65536 ;;
          esac
          # Report what actually runs, so the log carries the toolchain rather than an assumption.
          rustc "+${FUZZ_TOOLCHAIN}" --version --verbose
          # Assert the checked-in lock is current before fuzzing. `cargo fuzz run` has no
          # `--locked` — its BuildOptions carry only profile and feature flags — so the guarantee
          # has to be stated separately rather than passed through. Without it cargo resolves
          # freshly in the runner and rewrites the lock, so `fuzz/Cargo.lock` bound nothing and its
          # staleness was invisible: it sat at workspace 3.34.0 against a 3.35.0 tree, missing the
          # `assay-evidence -> assay-common` edge, and no CI run could have said so. A lockfile CI
          # does not honour cannot reproduce a fuzz finding, which is the only reason to keep one.
          #
          # The wrapper adds an exit code and nothing else. `--locked` also fails on an unparsable
          # manifest, an unavailable dependency, a registry or network fault, or a broken toolchain,
          # so a message naming one cause is a diagnosis this step never made — and the remedy it
          # used to print, `cargo update --workspace`, is actively wrong during a registry outage.
          # Only stdout is redirected, since that is the metadata JSON; Cargo's stderr stays the
          # diagnosis. Pinned by `scripts/ci/test-fuzz-lane-contract.sh`.
          ( cd fuzz && cargo "+${FUZZ_TOOLCHAIN}" metadata --locked --format-version 1 >/dev/null ) \
            || { echo "::error::locked fuzz metadata validation failed; inspect the Cargo error above"; exit 1; }
          fuzz_log="${RUNNER_TEMP}/fuzz.log"
          fuzz_status=0
          cargo "+${FUZZ_TOOLCHAIN}" fuzz run "${TARGET}" \
            "${RUNNER_TEMP}/fuzz-out" "fuzz/corpus/${TARGET}" \
            -- \
            -runs="${RUNS}" \
            -max_total_time="${MAX_TOTAL_TIME}" \
            -rss_limit_mb=2048 \
            -max_len="${MAX_LEN}" \
            -print_final_stats=1 > "${fuzz_log}" 2>&1 || fuzz_status=$?
          cat "${fuzz_log}"
          if [ "${fuzz_status}" -ne 0 ]; then
            exit "${fuzz_status}"
          fi
          bash scripts/ci/check-fuzz-executed-units.sh "${fuzz_log}" "${TARGET}"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
