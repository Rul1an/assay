name: Smoke Install (E2E)

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least-privilege. (If using optional test reporter: checks: write)
permissions:
  contents: read
  checks: write
  actions: read

jobs:
  assay:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Rust toolchain and cache
        uses: ./.github/actions/setup-rust

      - name: Build and Install Assay (from source)
        run: |
          # --locked: install with the committed Cargo.lock, not a fresh resolution. Without it
          # `cargo install` re-resolves to the newest semver-compatible deps, which can pull a broken
          # upstream combination (e.g. ratatui-widgets 0.3.1 + time 0.3.48 -> E0119) that the pinned
          # lockfile avoids. Matches the --locked the other `cargo install` calls in CI already use.
          cargo install --path crates/assay-cli --debug --locked
          assay --version

      - name: Migrate config (check-only, strict)
        shell: bash
        run: |
          set -euo pipefail
          # Expect: exit 0 if config is ok; exit 2 on error/legacy/unknown fields.
          assay migrate --check --config tests/fixtures/contract/pass.yaml

      - name: Run Assay suite (strict + JUnit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          assay ci \
            --config tests/fixtures/contract/pass.yaml \
            --strict \
            --junit reports/assay-junit.xml

      - name: Upload JUnit report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assay-junit
          path: reports/assay-junit.xml
          retention-days: 14

      # Optional: show JUnit directly in GitHub UI as Check Run / summary
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        continue-on-error: true
        with:
          name: Assay (JUnit)
          path: reports/assay-junit.xml
          reporter: java-junit
