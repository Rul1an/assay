name: MCP 2026 JSON-RPC id conformance

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "examples/mcp-jsonrpc-id-conformance/**"
      - ".github/workflows/mcp-2026-jsonrpc-id-conformance.yml"
      - ".github/workflows/mcp-2026-jsonrpc-id-drift.yml"
      - "scripts/ci/test_mcp_jsonrpc_id_workflow.py"
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - "examples/mcp-jsonrpc-id-conformance/**"
      - ".github/workflows/mcp-2026-jsonrpc-id-conformance.yml"
      - ".github/workflows/mcp-2026-jsonrpc-id-drift.yml"
      - "scripts/ci/test_mcp_jsonrpc_id_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.8"

concurrency:
  group: mcp-2026-jsonrpc-id-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: pack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show Python version
        run: python3 --version

      - name: Run pack and workflow contract tests
        run: |
          set -euo pipefail
          python3 -m unittest \
            examples/mcp-jsonrpc-id-conformance/tests/test_check.py
          python3 scripts/ci/test_mcp_jsonrpc_id_workflow.py

      - name: Reproduce committed finding
        run: |
          set -euo pipefail
          python3 examples/mcp-jsonrpc-id-conformance/check.py reproduce \
            > "$RUNNER_TEMP/reproduce.json"
          python3 -m json.tool "$RUNNER_TEMP/reproduce.json" >/dev/null

      - name: Reassess committed subject extracts
        run: |
          set -euo pipefail
          python3 examples/mcp-jsonrpc-id-conformance/check.py verify-committed \
            > "$RUNNER_TEMP/verify-committed.json"
          python3 -m json.tool "$RUNNER_TEMP/verify-committed.json" >/dev/null
