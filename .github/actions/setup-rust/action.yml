name: Setup Rust
description: >
  Install a SHA-pinned Rust toolchain and restore the cargo cache.
  Callers keep an explicit checkout; this composite does not check out the repo.

inputs:
  toolchain:
    description: Rust toolchain to install (passed to dtolnay/rust-toolchain).
    required: false
    default: stable
  components:
    description: Comma-separated rustup components (optional; empty adds none).
    required: false
    default: ""
  cache-workspaces:
    description: Workspace paths for Swatinem/rust-cache (optional; empty keeps action default).
    required: false
    default: ""
  cache-targets:
    description: >-
      Whether Swatinem/rust-cache saves and restores target/ ("true", the default). "false" drops
      target/ only; every other rust-cache setting keeps its default (the cargo registry and git
      caches, and with cache-bin the installed binaries and .crates.toml / .crates2.json).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        # Saved from main only. A pull-request run restores the cache main saved and does not
        # save its own copy: the copies pushed the repository over its cache size limit, and
        # entries were then evicted within the hour, on main as well.
        save-if: ${{ github.ref == 'refs/heads/main' }}
