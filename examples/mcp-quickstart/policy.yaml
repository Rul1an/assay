version: "2.0"
name: "mcp-quickstart"

tools:
  allow:
    - "read_file"
    - "list_dir"
  deny:
    - "exec"
    - "shell"
    - "write_file"

schemas:
  read_file:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
        pattern: '^/tmp/assay-demo/'
        not: &invalid_path_components
          pattern: '(^|/)\.{1,2}(/|$)|//|[\\\u0000-\u001F\u007F]'
        minLength: 1
    required:
      - "path"

  list_dir:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
        pattern: '^/tmp/assay-demo/'
        not: *invalid_path_components
        minLength: 1
    required:
      - "path"
