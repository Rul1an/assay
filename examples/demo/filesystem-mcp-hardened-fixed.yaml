version: '2.0'
name: filesystem-mcp-hardened
tools:
  allow:
  - read_file
  - read_multiple_files
  - list_directory
  - search_files
  - get_file_info
  - list_allowed_directories
  deny:
  - write_file
  - create_directory
  - move_file
  - create_symlink
  - read_symlink
# Only these two tools have lexical path checks. The server enforces filesystem access.
schemas:
  list_directory:
    additionalProperties: true
    properties:
      path:
        minLength: 1
        pattern: '^(/workspace|/home/[^/]+/projects|/Users/[^/]+/Developer)(/|$)'
        not: &invalid_path_components
          pattern: '(^|/)\.{1,2}(/|$)|//|[\\\u0000-\u001F\u007F]'
        type: string
    required:
    - path
    type: object
  read_file:
    additionalProperties: true
    properties:
      path:
        minLength: 1
        pattern: '^(/workspace/|/home/[^/]+/projects/|/Users/[^/]+/Developer/|/tmp/assay-[^/]+)'
        not: *invalid_path_components
        type: string
    required:
    - path
    type: object
enforcement:
  unconstrained_tools: warn
limits:
  max_requests_total: 200
  max_tool_calls_total: null
