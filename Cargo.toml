[workspace]
resolver = "2"
members = [
  "crates/assay-adapter-api",
  "crates/assay-adapter-a2a",
  "crates/assay-core",
  "crates/assay-metrics",
  "crates/assay-cli", "crates/assay-mcp-server",
  "crates/assay-xtask", "crates/assay-monitor",
  "crates/assay-ebpf", "crates/assay-common",
  "assay-python-sdk", "crates/assay-policy", "crates/assay-evidence", "crates/assay-sim",
  "crates/assay-registry",
  "crates/assay-canonical",
  "crates/gateway-evidence-replay",
  "crates/assay-runner-schema",
  "crates/assay-runner-core",
  "crates/assay-runner-linux",
]
default-members = [
  "crates/assay-core",
  "crates/assay-metrics",
  "crates/assay-cli",
  "crates/assay-mcp-server",
  "crates/assay-xtask",
  "crates/assay-monitor",
  "crates/assay-common",
  "assay-python-sdk",
]
exclude = ["fuzz"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "allow"
print_stdout = "allow"
missing_errors_doc = "allow"

[workspace.package]
version = "7.0.1"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Rul1an/assay"
authors = ["Assay"]
readme = "README.md"

[patch.crates-io]
assay-core = { path = "crates/assay-core" }
assay-metrics = { path = "crates/assay-metrics" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = true

# eBPF MUST be optimized, even in dev profile
[profile.dev.package.assay-ebpf]
opt-level = 2
debug = false
codegen-units = 1

[profile.release.package.assay-ebpf]
opt-level = 3
debug = false
codegen-units = 1

[workspace.dependencies]
url = "2.5.9"
serde_ignored = "0.1.14"
# Internal crates
assay-core = { path = "crates/assay-core", version = "7.0.1" }
assay-common = { path = "crates/assay-common", version = "7.0.1", default-features = false }
assay-monitor = { path = "crates/assay-monitor", version = "7.0.1" }
assay-metrics = { path = "crates/assay-metrics", version = "7.0.1" }
assay-policy = { path = "crates/assay-policy", version = "7.0.1" }
assay-mcp-server = { path = "crates/assay-mcp-server", version = "7.0.1" }
assay-canonical = { path = "crates/assay-canonical", version = "7.0.1" }
assay-evidence = { path = "crates/assay-evidence", version = "7.0.1" }
assay-sim = { path = "crates/assay-sim", version = "7.0.1" }
assay-registry = { path = "crates/assay-registry", version = "7.0.1" }
assay-runner-schema = { path = "crates/assay-runner-schema", version = "7.0.1" }
assay-runner-core = { path = "crates/assay-runner-core", version = "7.0.1" }
assay-runner-linux = { path = "crates/assay-runner-linux", version = "7.0.1" }

# Common dependencies
same-file = "1.0.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"], default-features = false }
tempfile = "3"
process-wrap = { version = "10.0", default-features = false }
regex = "1"
async-trait = "0.1"
sha2 = "0.11"
hex = "0.4"
flate2 = "1.1"
tar = "0.4"
aya = "=0.16.0"
aya-log = "=0.4.0"
# Pin to aya's object version (no second object line for P1 ELF reads).
object = { version = "=0.40.0", default-features = false, features = ["elf", "read_core", "std"] }
ratatui = "0.30"
crossterm = "0.29"
# assay-core names jsonschema::Validator in public signatures (policy_engine::evaluate_schema,
# McpPolicy::try_compile_all_schemas), so a 0.x minor bump here changes that public type for
# downstream crates that use jsonschema directly. Moving it is a compatibility decision (#3176).
jsonschema = { version = "0.55", default-features = false, features = ["idna"] }
