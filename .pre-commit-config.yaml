# .pre-commit-config.yaml
minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, pre-push]

# Best practice: pin versions (rev) and periodically `pre-commit autoupdate`.
repos:
  # Baseline hygiene (stable, fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]
        exclude: |
          (?x)^(
            tests/fixtures/mcp/malformed\.yaml|
            tests/fixtures/golden/eval_broken\.yaml
          )$
      - id: check-toml
      - id: end-of-file-fixer
        # Skip experiment archive-contents/: these are extracted from
        # measured-run .tar.gz archives and must match the original bytes
        # exactly so the manifest sha256 digest committed in matrix.json
        # is reproducible from the committed files. Adding a trailing
        # newline silently breaks the tamper-evident binding contract.
        #
        # Same rule, same reason, for the vendored MCP schema artifacts: they
        # are verbatim copies from a pinned spec commit and PIN.json records a
        # sha256 over the committed bytes. A trailing newline changes the
        # digest, so the pin would either fail or have to be re-recorded
        # against bytes that no longer match upstream — which is exactly the
        # property the pin exists to prove.
        exclude: |
          (?x)^(
            docs/experiments/.+/archive-contents/.+
            |crates/assay-core/tests/fixtures/mcp-era-parity-v0/schema-.+\.json
          )$
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            docs/experiments/.+/archive-contents/.+
            |crates/assay-core/tests/fixtures/mcp-era-parity-v0/schema-.+\.json
          )$

  # GitGuardian secrets detection (manual/local opt-in; requires GITGUARDIAN_API_KEY)
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.47.0
    hooks:
      - id: ggshield
        language_version: python3
        stages: [manual]

  # --- Tooling hooks (remote) ---
  - repo: local
    hooks:
      - id: mcpregistry-secret-hygiene
        name: MCP registry local token hygiene
        entry: scripts/ci/check-mcpregistry-secret-hygiene.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # typos (spellcheck)
  - repo: https://github.com/crate-ci/typos
    rev: v1.42.1
    hooks:
      - id: typos
        types_or: [text]
        args: ["--config", ".typos.toml", "--force-exclude"]

  # actionlint (GitHub Actions workflow lint)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        # GitHub Actions added concurrency.queue in May 2026; actionlint has not
        # caught up yet (rhysd/actionlint#657). Keep all other actionlint checks
        # active and remove this targeted ignore once upstream supports the key.
        args:
          - "-config-file"
          - ".github/actionlint.yaml"
          - "-ignore"
          - 'unexpected key "queue" for "concurrency" section'
        files: ^\.github/workflows/.*\.ya?ml$

  # Assay-Runner proof consumer: runs on PR-head via pre-commit/Kernel Matrix lint.
  - repo: local
    hooks:
      - id: assay-runner-lane-check-self-test
        name: Assay-Runner lane-check self-test
        entry: python3 scripts/ci/assay_runner_lane_check.py --self-test
        language: system
        pass_filenames: false
        # No `files:` filter, same reason as `runner-gating-map-drift` below. This
        # used to list the four files that define the classifier, which was right
        # while every assertion here read only those files. `_test_the_syscall_
        # surface_is_gated` reads the whole tree, so the trigger list made it blind
        # to the case it exists for: staging a new `.rs` that calls the kernel
        # skipped the hook entirely. The CI leg cannot cover that either -- the lane
        # workflow checks out the PR base on purpose, so a PR never runs this
        # against its own tree.

      - id: docs-generated-drift-self-test
        name: Generated-docs drift check self-test
        entry: bash -c 'bash scripts/ci/test-check-docs-generated-drift-safety.sh && bash scripts/ci/test-check-docs-generated-drift.sh'
        language: system
        pass_filenames: false
        # Both properties this pins have failed here before: `check-aee-seal-fixture-drift.sh`
        # documents an earlier version that ran its emitter in place and destroyed the fixtures it
        # audited, and `check-linux.sh` returned 0 on every failure (#2076).
        files: ^(scripts/ci/(check-docs-generated-drift|test-check-docs-generated-drift(?:-safety)?|lib/drift-tree-snapshot)\.sh|scripts/docs/generate-agent-golden-path\.py|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*)$

      - id: docs-generated-drift
        name: Generated docs match their generators
        entry: bash scripts/ci/check-docs-generated-drift.sh
        language: system
        pass_filenames: false
        # The drift used to be found *after* a merge, by `docs-auto-update.yml`, which then opened a
        # PR from `docs/auto-update` that could never be checked: `create-pull-request` signs it with
        # the default GITHUB_TOKEN, and GitHub does not run workflows for that token's events. #2021
        # sat blocked for a day with fifteen `action_required` runs and nothing to approve them
        # (#2080).
        #
        # Caught here instead, the diagram edge lands in the pull request that added the dependency,
        # where a reviewer can see why it moved. It also makes the bot's `has_changes` false by
        # construction, so the un-mergeable PR is never created.
        files: ^(Cargo\.toml|crates/.*/Cargo\.toml|scripts/docs/.*\.(sh|py)|docs/generated/.*|docs/AIcontext/architecture-diagrams\.md|docs/guides/agent-golden-path\.md|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|scripts/ci/check-docs-generated-drift\.sh|\.gitattributes|\.pre-commit-config\.yaml)$

      - id: agent-golden-path-skill-contract
        name: Agent golden-path skill contract
        entry: bash -c 'python3 scripts/ci/test-agent-golden-path-skill.py && python3 scripts/ci/test-golden-path-mock-bounds.py'
        language: system
        pass_filenames: false
        files: ^(scripts/docs/generate-agent-golden-path\.py|scripts/ci/(test-agent-golden-path-skill(-(optimization|hardening)\.sh|\.py)|test-golden-path-mock-bounds\.py|lib/golden-path-fixture-staging\.sh)|docs/generated/agent-golden-path\.json|docs/guides/agent-golden-path\.md|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|\.github/workflows/kernel-matrix\.yml|\.gitignore|\.gitattributes|\.pre-commit-config\.yaml)$

      - id: agent-golden-path-skill-mutations
        name: Agent golden-path skill mutations
        entry: bash -c 'bash scripts/ci/test-agent-golden-path-skill-optimization.sh && bash scripts/ci/test-agent-golden-path-skill-hardening.sh'
        language: system
        pass_filenames: false
        # The 92 mutation cases prove the validator has teeth, but their cost belongs
        # at the publish boundary rather than in every intermediate commit.
        stages: [pre-push]
        files: ^(scripts/docs/generate-agent-golden-path\.py|scripts/ci/(test-agent-golden-path-skill(-(optimization|hardening)\.sh|\.py)|test-golden-path-mock-bounds\.py|lib/golden-path-fixture-staging\.sh)|docs/generated/agent-golden-path\.json|docs/guides/agent-golden-path\.md|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|\.github/workflows/kernel-matrix\.yml|\.gitignore|\.gitattributes|\.pre-commit-config\.yaml)$

      - id: claude-plugin-install-workflow-self-test
        name: Claude plugin install workflow self-test
        entry: bash scripts/ci/test-claude-plugin-install.sh --self-test
        language: system
        pass_filenames: false
        # The full mutation suite drives install/update/cache/MCP/session behavior and
        # costs several seconds warm. Keep commit-time feedback fast; the same hook is
        # installed and enforced before push, where end-to-end workflow proof belongs.
        stages: [pre-push]
        files: ^(scripts/ci/(test-claude-plugin-install\.sh|claude_plugin_install_workflow\.py)|docs/guides/editor-mcp-recipe\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|\.pre-commit-config\.yaml)$

      - id: docs-auto-update-reconcile-self-test
        name: Docs auto-update reconciliation self-test
        entry: bash scripts/ci/test-reconcile-docs-auto-pr.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(reconcile-docs-auto-pr|test-reconcile-docs-auto-pr)\.sh|\.github/workflows/(docs-auto-update|ci|assay-runner-lane-check|host-capability-check)\.yml|\.pre-commit-config\.yaml)$

      - id: host-capability-proof-contract
        name: Host-capability proof cold-start contract
        entry: bash scripts/ci/test-host-capability-proof-contract.sh --self-test
        language: system
        pass_filenames: false
        files: ^(scripts/ci/test-host-capability-proof-contract\.sh|\.github/workflows/host-capability-proof\.yml|docs/reference/runner/host-capability-proof\.md|\.pre-commit-config\.yaml)$

      - id: aee-seal-producer-mutations
        name: ADR-045 seal producer mutations
        entry: bash -c 'python3 scripts/ci/test_aee_seal_producer_mutation_safety.py && python3 scripts/ci/test_aee_seal_producer_mutations.py'
        language: system
        pass_filenames: false
        # Each mutation names the test that must catch it. Run by hand this went wrong four times in
        # one session; mechanised it has not. Restores from scratch bytes held in-process, never from
        # git, and SIGINT/SIGTERM handlers rewrite those bytes before exit so an interrupted push
        # cannot leave the first mutant behind (#2318).
        #
        # pre-push, not pre-commit: fourteen `cargo test` runs cost ~56s warm, and a gate that taxes
        # every intermediate commit is a gate people learn to pass `--no-verify` to. The question it
        # answers -- does this suite still have teeth -- is a push-time question.
        #
        # Trigger is content paths only: editing unrelated hook config must not run this battery.
        stages: [pre-push]
        files: ^(crates/assay-cli/src/aee_seal\.rs|scripts/ci/test_aee_seal_producer_mutations\.py|scripts/ci/test_aee_seal_producer_mutation_safety\.py)$
      - id: aee-seal-producer-residue
        name: ADR-045 seal producer mutation residue
        entry: python3 scripts/ci/test_aee_seal_producer_mutations.py --check-residue
        language: system
        pass_filenames: false
        # Read-only fail-closed check: every declared mutant search anchor must still be present.
        # Catches interruption residue on the next commit without rewriting production code.
        files: ^(crates/assay-cli/src/aee_seal\.rs|scripts/ci/test_aee_seal_producer_mutations\.py)$
      - id: aee-seal-checker-coverage
        name: ADR-045 seal checker coverage
        entry: bash -c 'f=scripts/experiments/aee_landlock_seal_fixture.py; python3 $f --meta-test && python3 $f --required-field-test && python3 $f --rule-coverage-test && python3 $f --producer-vocabulary-test'
        language: system
        pass_filenames: false
        # Four properties the checker claims and nothing was checking.
        #
        # `--meta-test` says every negative control rejects for its own reason and no other; without
        # it a rule that fires on every control would read as broad coverage instead of one
        # indiscriminate rejection.
        #
        # `--required-field-test` says every field the contract marks required is refused when
        # absent, which is what the #2060 sweep found five gaps in.
        #
        # `--rule-coverage-test` says every reason code the checker can produce has a control that
        # produces it. The first two say nothing about a rule with no control at all, and there were
        # nine -- including the one #1998 requires by name. A rule can exist, be believed, and never
        # be shown to fire.
        #
        # `--producer-vocabulary-test` says an Assay producer member withholds credit and never
        # voids the record. The other three are blind to it: a phase is one word passed to `add`,
        # so `assayDropProofModel` decided AEE structural validity for two slices while all three
        # stayed green, and six sibling members did for three. It also reads `validate` back, so a
        # producer member that acquires a rule cannot acquire a phase by default.
        #
        # pre-commit, not pre-push: all four run in well under a second, and they are the tests
        # that tell you a rule you just wrote does not isolate.
        files: ^(scripts/experiments/aee_landlock_seal_fixture\.py|scripts/experiments/fixtures/aee-landlock-seal/.*|\.pre-commit-config\.yaml)$
      - id: aee-seal-fixture-drift
        name: ADR-045 seal fixture drift
        entry: bash scripts/ci/check-aee-seal-fixture-drift.sh
        language: system
        pass_filenames: false
        # The Rust producer's parity tests read `derivation-parity.json`, so the emitter and the
        # committed vectors have to stay in step; nothing else regenerates them.
        files: ^(scripts/experiments/aee_landlock_seal_fixture\.py|scripts/experiments/fixtures/aee-landlock-seal/.*|scripts/ci/check-aee-seal-fixture-drift\.sh|crates/assay-cli/src/aee_seal\.rs|\.pre-commit-config\.yaml)$
      - id: wildcard-expectations
        name: Wildcard suppressions still needed
        entry: bash scripts/ci/check-wildcard-expectations.sh
        language: system
        pass_filenames: false
        # `wildcard_enum_match_arm` is a restriction lint and stays off by default -- #2055 measured
        # why: it fires on foreign enums too, and `KeyCode` alone would need ~25 arms that do
        # nothing. But with it off, `unfulfilled_lint_expectations` never fires either, so every
        # `#[expect]` documents a decision that nothing re-checks. This runs the lint just long
        # enough to evaluate the expectations, and fails only on one that has gone stale.
        #
        # pre-push: a workspace clippy run is too slow to tax every intermediate commit.
        stages: [pre-push]
        files: ^(crates/.*\.rs|scripts/ci/check-wildcard-expectations\.sh|\.pre-commit-config\.yaml)$
      - id: runner-gating-map-drift
        name: Runner gating map drift
        entry: bash scripts/ci/check-runner-gating-map-drift.sh
        language: system
        pass_filenames: false
        # No `files:` filter on purpose. The map is derived from `git ls-files`,
        # so its input set is the whole tree while any trigger list is a handful
        # of paths -- adding a file under `runner-fixtures/` changed the map and
        # skipped the hook. The check costs ~0.2s, which is cheaper than a
        # trigger list that has to be kept in step with the gated surface.
      - id: fuzz-lane-contract-self-test
        name: Fuzz lane contract
        entry: bash scripts/ci/test-fuzz-lane-contract.sh
        language: system
        pass_filenames: false
        # `fuzz/Cargo.{toml,lock}` included: the contract derives the lane's required path filter
        # from the lock, so a change there can invalidate the assertion without touching either
        # file that used to trigger this hook.
        files: ^(scripts/ci/test-fuzz-lane-contract\.sh|\.github/workflows/fuzz-smoke\.yml|fuzz/Cargo\.(toml|lock)|\.pre-commit-config\.yaml)$

      - id: release-surface
        name: Release surface names the current version
        entry: bash scripts/ci/check-release-surface.sh
        language: system
        pass_filenames: false
        # Triggers on the files it can be wrong about, plus itself. It does not need a binary: with
        # no `target/` build it falls back to the manifest version, so a release-prep commit is
        # checked without waiting on a compile.
        files: ^(scripts/ci/check-release-surface\.sh|Cargo\.toml|docs/getting-started/installation\.md|\.pre-commit-config\.yaml)$

      - id: ci-gate-expectations-self-test
        name: CI gate expectation contract
        entry: bash scripts/ci/test-ci-gate-expectations.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/test-ci-gate-expectations\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: ci-job-timeouts-contract-self-test
        name: CI job timeout-minutes contract
        entry: bash scripts/ci/test-ci-job-timeouts-contract.sh --self-test
        language: system
        pass_filenames: false
        # Pins every ci.yml job's timeout class (#2244 / CI-5B). Missing ceilings inherit GitHub's
        # 360-minute default; this hook rejects that, wrong classes, and eBPF drift.
        files: ^(scripts/ci/test-ci-job-timeouts-contract\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: ci-gate-coverage
        name: Required CI gate waits on every gating job
        entry: bash -c 'python3 scripts/ci/check-ci-gate-coverage.py --self-test && python3 scripts/ci/check-ci-gate-coverage.py'
        language: system
        pass_filenames: false
        # The hook above asks whether the gate judged its dependencies correctly; this one asks
        # whether the dependency list covers the workflow. `publish-shape-cli` and
        # `public-crate-policy` passed the first question and failed the second for eleven weeks,
        # because nothing was asking it (#2230). The same check runs inside the `CI` job itself, so
        # the required context, not only a local hook, is what refuses.
        #
        # The ruleset is in `files:` because the guard finds the rollup by matching a job's
        # reported name against the required contexts; editing that artifact can change which job
        # it believes it is checking.
        files: ^(scripts/ci/check-ci-gate-coverage\.py|\.github/workflows/ci\.yml|\.github/rulesets/main-required-ci-contexts\.json|\.pre-commit-config\.yaml)$

      - id: setup-rust-composite-contract-self-test
        name: Setup-rust composite contract
        entry: bash scripts/ci/test-setup-rust-composite-contract.sh
        language: system
        pass_filenames: false
        files: ^(\.github/actions/setup-rust/action\.yml|scripts/ci/test-setup-rust-composite-contract\.sh|\.pre-commit-config\.yaml|\.github/workflows/[^/]+\.ya?ml)$

      - id: s1b-coverage-gate-contract
        name: S1b send-matrix coverage-gate contract
        entry: bash scripts/ci/test-s1b-coverage-gate.sh
        language: system
        pass_filenames: false
        # External invocation: commenting the workflow suite line must not leave CI
        # as the only runner of this contract. Trigger on S1b scripts, workflow,
        # pre-commit config, and the send-observation producer.
        files: ^(scripts/ci/(test-s1b-coverage-gate|run-send-syscall-matrix|s1b-compile-and-contract|s1b-positive-matrix|s1b-attach-disabled)\.sh|scripts/ci/s1b-send-syscall-matrix\.c|\.github/workflows/(monitor-attach-smoke|kernel-matrix)\.yml|crates/assay-cli/src/cli/commands/monitor_next/(output|mod)\.rs|crates/assay-monitor/src/loader\.rs|\.pre-commit-config\.yaml)$

      - id: mcp-registry-release-txn-self-test
        name: MCP Registry release transaction self-test
        entry: bash scripts/ci/test-mcp-registry-release-txn.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(resolve-mcp-registry-tag|check-mcp-registry-version|record-mcp-registry-result|test-mcp-registry-release-txn)\.sh|\.github/workflows/(mcp-registry-publish|release)\.yml|\.pre-commit-config\.yaml)$

  # shellcheck (bash) — use system binary to avoid SSL/download issues
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: ["-x", "-S", "warning"]
        language: system
        types: [shell]

  # --- Rust: fmt on commit (fast), clippy on push (heavier) ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -lc 'cargo fmt --all -- --check'
        language: system
        types_or: [rust]
        always_run: true
        pass_filenames: false

      # --- Dependency security (shift-left) ---
      - id: cargo-deny
        name: cargo deny (advisories, licenses, bans, sources)
        # `cargo-deny` rather than `cargo deny`: going through cargo resolves the toolchain from
        # rust-toolchain.toml, which in CI selects a toolchain the lint job never installed. The
        # binary runs the same checks without that resolution. No version assertion here -- the pin
        # is enforced where CI installs it, and asserting it in a local hook would fail every
        # developer whose cargo-deny predates the pin.
        entry: bash -lc 'cargo-deny check advisories bans licenses sources'
        language: system
        pass_filenames: false
        # Only run when deps/policy change (avoids noise on unrelated commits)
        files: ^(Cargo\.lock|Cargo\.toml|crates/.*/Cargo\.toml|deny\.toml)$
        stages: [pre-commit]

      - id: cargo-audit
        name: cargo audit (RustSec)
        # Isolated advisory DB via scripts/ci/cargo-audit-with-isolated-db.sh (CI-4F / #2188).
        # Same runner as both CI cargo-audit steps; do not call bare `cargo-audit audit` here.
        # The runner invokes `cargo-audit audit` (not `cargo audit`) so rust-toolchain.toml
        # resolution does not select a toolchain the developer never installed (#2237).
        # Keep any ignore list in lockstep with the three peer locations that carry it:
        # deny.toml, .github/workflows/ci.yml and .cargo/audit.toml. Naming all of them matters —
        # an incomplete peer list is how this hook drifted in the first place. The list is empty
        # after CI-4C (#2231) removed the last matching exception; do not reintroduce ignores here
        # without updating those peers and the rsa-removal contract check.
        entry: bash scripts/ci/cargo-audit-with-isolated-db.sh
        language: system
        pass_filenames: false
        files: ^Cargo\.lock$
        stages: [pre-push]

      - id: cargo-audit-isolated-db-self-test
        name: cargo-audit isolated advisory DB
        entry: bash scripts/ci/test-cargo-audit-with-isolated-db.sh
        language: system
        pass_filenames: false
        # CI-4F / #2188: one runner for hook + both CI audits; deny.toml plural root;
        # no global rm -rf of ~/.cargo/advisory-db. Mutations cover stripping --db,
        # restoring the shared singular deny path, restoring rm -rf, and bare-audit bypass.
        files: ^(scripts/ci/(cargo-audit-with-isolated-db|test-cargo-audit-with-isolated-db)\.sh|deny\.toml|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: install-cargo-deny-self-test
        name: cargo-deny install pin self-test
        entry: bash scripts/ci/test-install-cargo-deny.sh
        language: system
        pass_filenames: false
        # The install script carries the pin, the toolchain export and the version assertion, and
        # before this hook nothing exercised any of them: removing `--version`, removing the export,
        # or rewriting the assertion to `if false` each left the script exiting 0 while still printing
        # a version line that reads as evidence of a pin. The self-test drives stub cargo/cargo-deny
        # binaries on PATH, so it costs no network and no install.
        files: ^(scripts/ci/(install-cargo-deny|test-install-cargo-deny)\.sh|\.pre-commit-config\.yaml)$

      - id: deps-security-toolchain-contract-self-test
        name: deps-security toolchain contract
        entry: bash scripts/ci/test-deps-security-toolchain-contract.sh
        language: system
        pass_filenames: false
        # Protects the workflow half the install self-test cannot see: deleting or weakening
        # deps-security's RUSTUP_TOOLCHAIN, and restoring the false "never compiles a crate" claim.
        # files: includes ci.yml so a workflow-only edit still runs this gate in Lint (pre-commit).
        files: ^(scripts/ci/(install-cargo-deny|test-deps-security-toolchain-contract)\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: cargo-plugin-versions-contract-self-test
        name: cargo-plugin versions contract
        entry: bash scripts/ci/test-cargo-plugin-versions-contract.sh
        language: system
        pass_filenames: false
        # CI-4D1 / #2224: pin cargo-audit from one shared source. CI-4D4 also pins the review
        # helper's direct cargo-deny invocation. Mutations cover removing --version, restating
        # the pin, PATH decoys, dropping source/assert, and reverting the helper to cargo deny.
        files: ^(scripts/ci/(cargo-plugin-versions|test-cargo-plugin-versions-contract|review-dependency-perf-hygiene-pr4)\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: split-wave-plugin-versions-contract-self-test
        name: split-wave plugin versions contract
        entry: bash scripts/ci/test-split-wave-plugin-versions-contract.sh
        language: system
        pass_filenames: false
        # CI-4D2 / #2224: pin nextest/hack/semver-checks from the same shared source. CI-4D4
        # also pins install-step comment semantics (step-scoped install; plugins bind stable;
        # workspace cargo follows rust-toolchain.toml). Mutations cover missing pins, restated
        # literals, missing source/assert, unpinned/duplicate install (including cargo
        # +toolchain), PATH decoys, optional-helper unpin, and stale toolchain comments.
        files: ^(scripts/ci/(cargo-plugin-versions|test-split-wave-plugin-versions-contract|optional-public-api-drift)\.sh|\.github/workflows/split-wave0-gates\.yml|\.pre-commit-config\.yaml)$

      - id: optional-plugin-versions-contract-self-test
        name: optional plugin versions contract
        entry: bash scripts/ci/test-optional-plugin-versions-contract.sh
        language: system
        pass_filenames: false
        # CI-4D3 / #2224: pin cargo-public-api + cargo-mutants from the same shared source.
        # Mutations cover absent pins, restated literals, missing source/assert, unpinned or
        # cargo +toolchain install, PATH decoys, missing invocation toolchain binding, and
        # opt-in/opt-out skip semantics.
        files: ^(scripts/ci/(cargo-plugin-versions|test-optional-plugin-versions-contract|optional-public-api-drift|mutation-smoke-pure-modules)\.sh|\.pre-commit-config\.yaml)$

      - id: ebpf-pin-parity-contract-self-test
        name: eBPF pin parity contract
        entry: python3 scripts/ci/test-ebpf-pin-parity-contract.py
        language: system
        pass_filenames: false
        # CI-4E / #2225: parity fallback over five eBPF pin consumers. Canonical defaults live in
        # install-ebpf-toolchain.sh; missing/ambiguous/divergent pins fail. No shared manifest and
        # no upstream-availability claim.
        # Root .pre-commit-config.yaml is a top-level alternative (not under scripts/ci/).
        files: ^(\.pre-commit-config\.yaml|scripts/ci/(install-ebpf-toolchain\.sh|test-ebpf-pin-parity-contract\.py)|crates/assay-xtask/src/main\.rs|infra/bpf-runner/(setup\.sh|cloud-init\.yaml)|docker/Dockerfile\.ebpf-builder)$

      - id: cargo-clippy
        name: cargo clippy (workspace, deny warnings)
        entry: scripts/precommit/cargo-clippy.sh
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: semver-gate-self-test
        name: Semver gate self-test
        entry: bash scripts/ci/test-semver-gate.sh
        language: system
        pass_filenames: false
        # The gate could not fail (#2088). Its baseline was pinned to `chore: release v2.18.0`, so
        # `check-release` saw a declared major and skipped all 254 checks -- reporting success while
        # #2068's `MetricResult` break went through and was found by hand at release prep.
        #
        # The cheap cases run here: no pinned SHA, the baseline comes from the newest release tag,
        # and a missing tag fails rather than skips. The planted-break case costs a rustdoc build per
        # crate, so it runs under ASSAY_SEMVER_GATE_FULL=1 and in the workflow's own CI job.
        stages: [pre-push]
        files: ^(scripts/ci/test-semver-gate\.sh|\.github/workflows/split-wave0-gates\.yml)$
      - id: linux-gate-self-test
        name: Linux compile gate self-test
        entry: bash scripts/ci/test-check-linux.sh
        language: system
        pass_filenames: false
        # The gate could not fail (#2076): every branch ended in `return 0`, so a timeout, a
        # third-party build script and a real Linux compile error were one outcome. #2074 pushed
        # four E0425s through it and the delegated host found them.
        #
        # This plants a deliberate `cfg(target_os = "linux")` error and requires a non-zero exit --
        # the property the gate exists for and could not previously demonstrate.
        stages: [pre-push]
        files: ^scripts/ci/(check-linux|test-check-linux)\.sh$
      - id: linux-check
        name: linux compile gate (cross-target)
        entry: bash scripts/ci/check-linux.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        # Cross-compile only. The `multipass` VM mode this used to name is gone (#2077): its clippy
        # run ended in `return 0` on failure, so like the cross-target path it could not fail, and
        # keeping a second fail-open path would have meant fixing the defect in one of two places.
        #
        # ASSAY_LINUX_TARGET_TIMEOUT=300 (default) bounds each crate's check.
        # ASSAY_LINUX_CHECK_REQUIRE_FULL=1 makes incomplete coverage a failure rather than a warning.
