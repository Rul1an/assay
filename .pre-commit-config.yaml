        language: system
        pass_filenames: false
        # Triggers on the recipe it judges, the guard and its self-test, and itself. The self-test
        # runs first so a guard whose rules match nothing fails here rather than passing quietly.
        files: ^(scripts/ci/(check|test-check)-editor-mcp-recipe-truth\.sh|docs/guides/editor-mcp-recipe\.md|\.pre-commit-config\.yaml)$

      - id: ci-gate-expectations-self-test
        name: CI gate expectation contract
        entry: bash scripts/ci/test-ci-gate-expectations.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/test-ci-gate-expectations\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: ci-job-timeouts-contract-self-test
        name: CI job timeout-minutes contract
        entry: bash scripts/ci/test-ci-job-timeouts-contract.sh --self-test
        language: system
        pass_filenames: false
        # Pins every ci.yml job's timeout class (#2244 / CI-5B). Missing ceilings inherit GitHub's
        # 360-minute default; this hook rejects that, wrong classes, and eBPF drift.
        files: ^(scripts/ci/test-ci-job-timeouts-contract\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: mcp-preflight-windows-contract-self-test
        name: Native Windows MCP preflight workflow contract
        entry: bash scripts/ci/test-mcp-preflight-windows-contract.sh --self-test
        language: system
        pass_filenames: false
        files: ^(crates/assay-cli/tests/mcp_preflight_contract\.rs|scripts/ci/test-mcp-preflight-windows-contract\.sh|\.github/workflows/ci\.yml|docs/reference/cli/mcp-server\.md|\.pre-commit-config\.yaml)$

      - id: ci-gate-coverage
        name: Required CI gate waits on every gating job
        entry: bash -c 'python3 scripts/ci/check-ci-gate-coverage.py --self-test && python3 scripts/ci/check-ci-gate-coverage.py'
        language: system
        pass_filenames: false
        # The hook above asks whether the gate judged its dependencies correctly; this one asks
        # whether the dependency list covers the workflow. `publish-shape-cli` and
        # `public-crate-policy` passed the first question and failed the second for eleven weeks,
        # because nothing was asking it (#2230). The same check runs inside the `CI` job itself, so
        # the required context, not only a local hook, is what refuses.
        #
        # The ruleset is in `files:` because the guard finds the rollup by matching a job's
        # reported name against the required contexts; editing that artifact can change which job
        # it believes it is checking.
        files: ^(scripts/ci/check-ci-gate-coverage\.py|\.github/workflows/ci\.yml|\.github/rulesets/main-required-ci-contexts\.json|\.pre-commit-config\.yaml)$

      - id: setup-rust-composite-contract-self-test
        name: Setup-rust composite contract
        entry: bash scripts/ci/test-setup-rust-composite-contract.sh
        language: system
        pass_filenames: false
        files: ^(\.github/actions/setup-rust/action\.yml|scripts/ci/test-setup-rust-composite-contract\.sh|scripts/ci/test-host-capability-proof-contract\.sh|\.pre-commit-config\.yaml|\.github/workflows/[^/]+\.ya?ml)$

      - id: s1b-coverage-gate-contract
        name: S1b send-matrix coverage-gate contract
        entry: bash scripts/ci/test-s1b-coverage-gate.sh
        language: system
        pass_filenames: false
        # External invocation: commenting the workflow suite line must not leave CI
        # as the only runner of this contract. Trigger on S1b scripts, workflow,
        # pre-commit config, and the send-observation producer.
        files: ^(scripts/ci/(test-s1b-coverage-gate|run-send-syscall-matrix|s1b-compile-and-contract|s1b-positive-matrix|s1b-attach-disabled)\.sh|scripts/ci/s1b-send-syscall-matrix\.c|\.github/workflows/(monitor-attach-smoke|kernel-matrix)\.yml|crates/assay-cli/src/cli/commands/monitor_next/(output|mod)\.rs|crates/assay-monitor/src/loader\.rs|\.pre-commit-config\.yaml)$

      - id: mcp-registry-release-txn-self-test
        name: MCP Registry release transaction self-test
        entry: bash scripts/ci/test-mcp-registry-release-txn.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(resolve-mcp-registry-tag|check-mcp-registry-version|record-mcp-registry-result|test-mcp-registry-release-txn)\.sh|\.github/workflows/(mcp-registry-publish|release)\.yml|\.pre-commit-config\.yaml)$

  # shellcheck (bash) — use system binary to avoid SSL/download issues
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: ["-x", "-S", "warning"]
        language: system
        types: [shell]

  # --- Rust: fmt on commit (fast), clippy on push (heavier) ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -lc 'cargo fmt --all -- --check'
        language: system
        types_or: [rust]
        always_run: true
        pass_filenames: false

      # --- Dependency security (shift-left) ---
      - id: cargo-deny
        name: cargo deny (advisories, licenses, bans, sources)
        # `cargo-deny` rather than `cargo deny`: going through cargo resolves the toolchain from
        # rust-toolchain.toml, which in CI selects a toolchain the lint job never installed. The
        # binary runs the same checks without that resolution. No version assertion here -- the pin
        # is enforced where CI installs it, and asserting it in a local hook would fail every
        # developer whose cargo-deny predates the pin.
        entry: bash -lc 'cargo-deny check advisories bans licenses sources'
        language: system
        pass_filenames: false
        # Only run when deps/policy change (avoids noise on unrelated commits)
        files: ^(Cargo\.lock|Cargo\.toml|crates/.*/Cargo\.toml|deny\.toml)$
        stages: [pre-commit]

      - id: cargo-audit
        name: cargo audit (RustSec)
        # Isolated advisory DB via scripts/ci/cargo-audit-with-isolated-db.sh (CI-4F / #2188).
        # Same runner as both CI cargo-audit steps; do not call bare `cargo-audit audit` here.
        # The runner invokes `cargo-audit audit` (not `cargo audit`) so rust-toolchain.toml
        # resolution does not select a toolchain the developer never installed (#2237).
        # Keep any ignore list in lockstep with the three peer locations that carry it:
        # deny.toml, .github/workflows/ci.yml and .cargo/audit.toml. Naming all of them matters —
        # an incomplete peer list is how this hook drifted in the first place. The list is empty
        # after CI-4C (#2231) removed the last matching exception; do not reintroduce ignores here
        # without updating those peers and the rsa-removal contract check.
        entry: bash scripts/ci/cargo-audit-with-isolated-db.sh
        language: system
        pass_filenames: false
        files: ^Cargo\.lock$
        stages: [pre-push]

      - id: cargo-audit-isolated-db-self-test
        name: cargo-audit isolated advisory DB
        entry: bash scripts/ci/test-cargo-audit-with-isolated-db.sh
        language: system
        pass_filenames: false
        # CI-4F / #2188: one runner for hook + both CI audits; deny.toml plural root;
        # no global rm -rf of ~/.cargo/advisory-db. Mutations cover stripping --db,
        # restoring the shared singular deny path, restoring rm -rf, and bare-audit bypass.
        files: ^(scripts/ci/(cargo-audit-with-isolated-db|test-cargo-audit-with-isolated-db)\.sh|deny\.toml|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: install-cargo-deny-self-test
        name: cargo-deny install pin self-test
        entry: bash scripts/ci/test-install-cargo-deny.sh
        language: system
        pass_filenames: false
        # The install script carries the pin, the toolchain export and the version assertion, and
        # before this hook nothing exercised any of them: removing `--version`, removing the export,
        # or rewriting the assertion to `if false` each left the script exiting 0 while still printing
        # a version line that reads as evidence of a pin. The self-test drives stub cargo/cargo-deny
        # binaries on PATH, so it costs no network and no install.
        files: ^(scripts/ci/(install-cargo-deny|test-install-cargo-deny)\.sh|\.pre-commit-config\.yaml)$

      - id: install-version-normalization-self-test
        name: installer version normalization contract
        entry: bash scripts/ci/test-install-version-normalization.sh
        language: system
        pass_filenames: false
        files: ^(scripts/install\.sh|scripts/ci/test-install-version-normalization\.sh|\.pre-commit-config\.yaml)$

      - id: deps-security-toolchain-contract-self-test
        name: deps-security toolchain contract
        entry: bash scripts/ci/test-deps-security-toolchain-contract.sh
        language: system
        pass_filenames: false
        # Protects the workflow half the install self-test cannot see: deleting or weakening
        # deps-security's RUSTUP_TOOLCHAIN, and restoring the false "never compiles a crate" claim.
        # files: includes ci.yml so a workflow-only edit still runs this gate in Lint (pre-commit).
        files: ^(scripts/ci/(install-cargo-deny|test-deps-security-toolchain-contract)\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: cargo-plugin-versions-contract-self-test
        name: cargo-plugin versions contract
        entry: bash scripts/ci/test-cargo-plugin-versions-contract.sh
        language: system
        pass_filenames: false
        # CI-4D1 / #2224: pin cargo-audit from one shared source. CI-4D4 also pins the review
        # helper's direct cargo-deny invocation. Mutations cover removing --version, restating
        # the pin, PATH decoys, dropping source/assert, and reverting the helper to cargo deny.
        files: ^(scripts/ci/(cargo-plugin-versions|test-cargo-plugin-versions-contract|review-dependency-perf-hygiene-pr4)\.sh|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml)$

      - id: split-wave-plugin-versions-contract-self-test
        name: split-wave plugin versions contract
        entry: bash scripts/ci/test-split-wave-plugin-versions-contract.sh
        language: system
        pass_filenames: false
        # CI-4D2 / #2224: pin nextest/hack/semver-checks from the same shared source. CI-4D4
        # also pins install-step comment semantics (step-scoped install; plugins bind stable;
        # workspace cargo follows rust-toolchain.toml). Mutations cover missing pins, restated
        # literals, missing source/assert, unpinned/duplicate install (including cargo
        # +toolchain), PATH decoys, optional-helper unpin, and stale toolchain comments.
        files: ^(scripts/ci/(cargo-plugin-versions|test-split-wave-plugin-versions-contract|optional-public-api-drift)\.sh|\.github/workflows/split-wave0-gates\.yml|\.pre-commit-config\.yaml)$

      - id: optional-plugin-versions-contract-self-test
        name: optional plugin versions contract
        entry: bash scripts/ci/test-optional-plugin-versions-contract.sh
        language: system
        pass_filenames: false
        # CI-4D3 / #2224: pin cargo-public-api + cargo-mutants from the same shared source.
        # Mutations cover absent pins, restated literals, missing source/assert, unpinned or
        # cargo +toolchain install, PATH decoys, missing invocation toolchain binding, and
        # opt-in/opt-out skip semantics.
        files: ^(scripts/ci/(cargo-plugin-versions|test-optional-plugin-versions-contract|optional-public-api-drift|mutation-smoke-pure-modules)\.sh|\.pre-commit-config\.yaml)$

      - id: ebpf-pin-parity-contract-self-test
        name: eBPF pin parity contract
        entry: python3 scripts/ci/test-ebpf-pin-parity-contract.py
        language: system
        pass_filenames: false
        # CI-4E / #2225: parity fallback over five eBPF pin consumers. Canonical defaults live in
        # install-ebpf-toolchain.sh; missing/ambiguous/divergent pins fail. No shared manifest and
        # no upstream-availability claim.
        # Root .pre-commit-config.yaml is a top-level alternative (not under scripts/ci/).
        files: ^(\.pre-commit-config\.yaml|scripts/ci/(install-ebpf-toolchain\.sh|test-ebpf-pin-parity-contract\.py)|crates/assay-xtask/src/main\.rs|infra/bpf-runner/(setup\.sh|cloud-init\.yaml)|docker/Dockerfile\.ebpf-builder)$

      - id: cargo-clippy
        name: cargo clippy (workspace, deny warnings)
        entry: scripts/precommit/cargo-clippy.sh
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: ci-programme-truth
        name: CI programme-truth contract
        entry: bash -c 'bash scripts/ci/test-ci-programme-truth.sh && bash scripts/ci/test-review-split-wave.sh'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
        files: ^(AGENTS\.md|docs/contributing/(WAVE0-GATES|REFACTOR-WAVE-STATUS)\.md|\.github/(workflows/(split-wave0-gates|kernel-matrix)\.yml|rulesets/main-required-ci-contexts\.json)|scripts/ci/(review-split-wave|test-ci-programme-truth|test-review-split-wave)\.sh|scripts/ci/lib/resource_ceilings\.py|\.pre-commit-config\.yaml)$

      - id: semver-gate-self-test
        name: Semver gate self-test
        entry: bash scripts/ci/test-semver-gate.sh
        language: system
        pass_filenames: false
        # The gate could not fail (#2088). Its baseline was pinned to `chore: release v2.18.0`, so
        # `check-release` saw a declared major and skipped all 254 checks -- reporting success while
        # #2068's `MetricResult` break went through and was found by hand at release prep.
        #
        # The cheap cases run here: no pinned SHA, the baseline comes from the newest release tag,
        # and a missing tag fails rather than skips. The planted-break case costs a rustdoc build per
        # crate, so it runs under ASSAY_SEMVER_GATE_FULL=1 and in the workflow's own CI job.
        stages: [pre-push]
        files: ^(scripts/ci/test-semver-gate\.sh|\.github/workflows/split-wave0-gates\.yml)$
      - id: linux-gate-self-test
        name: Linux compile gate self-test
        entry: bash scripts/ci/test-check-linux.sh
        language: system
        pass_filenames: false
        # The gate could not fail (#2076): every branch ended in `return 0`, so a timeout, a
        # third-party build script and a real Linux compile error were one outcome. #2074 pushed
        # four E0425s through it and the delegated host found them.
        #
        # This plants a deliberate `cfg(target_os = "linux")` error and requires a non-zero exit --
        # the property the gate exists for and could not previously demonstrate.
        stages: [pre-push]
        files: ^scripts/ci/(check-linux|test-check-linux)\.sh$
      - id: linux-check
        name: linux compile gate (cross-target)
        entry: bash scripts/ci/check-linux.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        # Cross-compile only. The `multipass` VM mode this used to name is gone (#2077): its clippy
        # run ended in `return 0` on failure, so like the cross-target path it could not fail, and
        # keeping a second fail-open path would have meant fixing the defect in one of two places.
        #
        # ASSAY_LINUX_TARGET_TIMEOUT=300 (default) bounds each crate's check.
        # ASSAY_LINUX_CHECK_REQUIRE_FULL=1 makes incomplete coverage a failure rather than a warning.
