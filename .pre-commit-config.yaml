# .pre-commit-config.yaml
minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, pre-push]

# Best practice: pin versions (rev) and periodically `pre-commit autoupdate`.
repos:
  # Baseline hygiene (stable, fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]
        exclude: |
          (?x)^(
            tests/fixtures/mcp/malformed\.yaml|
            tests/fixtures/golden/eval_broken\.yaml|
            scripts/ci/fixtures/assay-action-pin/action\.yml
          )$
      - id: check-toml
      - id: end-of-file-fixer
        # Skip experiment archive-contents/: these are extracted from
        # measured-run .tar.gz archives and must match the original bytes
        # exactly so the manifest sha256 digest committed in matrix.json
        # is reproducible from the committed files. Adding a trailing
        # newline silently breaks the tamper-evident binding contract.
        #
        # Same rule, same reason, for the vendored MCP schema artifacts: they
        # are verbatim copies from a pinned spec commit and PIN.json records a
        # sha256 over the committed bytes. A trailing newline changes the
        # digest, so the pin would either fail or have to be re-recorded
        # against bytes that no longer match upstream — which is exactly the
        # property the pin exists to prove.
        exclude: |
          (?x)^(
            docs/experiments/.+/archive-contents/.+
            |crates/assay-core/tests/fixtures/mcp-era-parity-v0/schema-.+\.json
            |third_party/serde_jcs-0\.2\.0/.+
            |scripts/ci/fixtures/assay-action-pin/action\.yml
          )$
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            docs/experiments/.+/archive-contents/.+
            |crates/assay-core/tests/fixtures/mcp-era-parity-v0/schema-.+\.json
            |third_party/serde_jcs-0\.2\.0/.+
            |scripts/ci/fixtures/assay-action-pin/action\.yml
          )$

  # GitGuardian secrets detection (manual/local opt-in; requires GITGUARDIAN_API_KEY)
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.47.0
    hooks:
      - id: ggshield
        language_version: python3
        stages: [manual]

  # --- Tooling hooks (remote) ---
  - repo: local
    hooks:
      - id: mcpregistry-secret-hygiene
        name: MCP registry local token hygiene
        entry: scripts/ci/check-mcpregistry-secret-hygiene.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # typos (spellcheck)
  - repo: https://github.com/crate-ci/typos
    rev: v1.42.1
    hooks:
      - id: typos
        types_or: [text]
        args: ["--config", ".typos.toml", "--force-exclude"]

  # actionlint (GitHub Actions workflow lint)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        # GitHub Actions added concurrency.queue in May 2026; actionlint has not
        # caught up yet (rhysd/actionlint#657). Keep all other actionlint checks
        # active and remove this targeted ignore once upstream supports the key.
        args:
          - "-config-file"
          - ".github/actionlint.yaml"
          - "-ignore"
          - 'unexpected key "queue" for "concurrency" section'
        files: ^\.github/workflows/.*\.ya?ml$

  # Assay-Runner proof consumer: runs on PR-head via pre-commit/Kernel Matrix lint.
  - repo: local
    hooks:
      - id: assay-review-record-self-test
        name: Review-record checker self-test
        entry: python3 scripts/ci/assay_review_record_check.py --self-test
        language: system
        pass_filenames: false
        files: ^(scripts/ci/assay_review_record_check\.py|docs/reference/review-record\.md|\.github/workflows/review-record-check\.yml|\.pre-commit-config\.yaml)$
      - id: review-record-workflow-contract
        name: Review-record workflow structural contract
        entry: python3 scripts/ci/test-review-record-workflow.py
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(assay_review_record_check|check-review-record-workflow|test-review-record-workflow)\.py|\.github/workflows/(review-record-check|host-capability-check|ci)\.yml|docs/reference/review-record\.md|\.pre-commit-config\.yaml)$
      - id: assay-runner-lane-check-self-test
        name: Assay-Runner lane-check self-test
        entry: python3 scripts/ci/assay_runner_lane_check.py --self-test
        language: system
        pass_filenames: false
        # No `files:` filter, same reason as `runner-gating-map-drift` below. This
        # used to list the four files that define the classifier, which was right
        # while every assertion here read only those files. `_test_the_syscall_
        # surface_is_gated` reads the whole tree, so the trigger list made it blind
        # to the case it exists for: staging a new `.rs` that calls the kernel
        # skipped the hook entirely. The CI leg cannot cover that either -- the lane
        # workflow checks out the PR base on purpose, so a PR never runs this
        # against its own tree.

      - id: runner-auto-recovery-contract
        name: Runner auto-recovery token freshness
        entry: bash scripts/ci/test-runner-auto-recovery.sh
        language: system
        pass_filenames: false
        files: ^(infra/bpf-runner/health_check\.sh|scripts/ci/test-runner-auto-recovery\.sh)$

      - id: docs-generated-drift-self-test
        name: Generated-docs drift check self-test
        entry: bash -c 'bash scripts/ci/test-check-docs-generated-drift-safety.sh && bash scripts/ci/test-check-docs-generated-drift.sh'
        language: system
        pass_filenames: false
        # Both properties this pins have failed here before: `check-aee-seal-fixture-drift.sh`
        # documents an earlier version that ran its emitter in place and destroyed the fixtures it
        # audited, and `check-linux.sh` returned 0 on every failure (#2076).
        files: ^(scripts/ci/(check-docs-generated-drift|test-check-docs-generated-drift(?:-safety)?|lib/drift-tree-snapshot|read-assay-release-tag)\.sh|scripts/ci/lib/workspace_version\.py|scripts/docs/generate-agent-golden-path\.py|\.github/assay-release-tag|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|packaging/agent-plugin/.*)$

      - id: product-capability-generator-self-test
        name: Product capability generator self-test
        entry: python3 scripts/ci/test-generate-product-capabilities.py
        language: system
        pass_filenames: false
        files: ^(scripts/(ci/test-generate-product-capabilities|docs/generate-product-capabilities)\.py|docs/data/product-capabilities\.v0\.json|docs/(reference/product-support|generated/product-claim-proof)\.md)$

      - id: sep2828-fallback-classifier-self-test
        name: SEP-2828 fallback reproduction self-test
        entry: bash -c 'python3 scripts/ci/test_classify_sep2828_fallback.py && python3 scripts/ci/test_reproduce_sep2828_decision_pairing.py'
        language: system
        pass_filenames: false
        files: ^(scripts/(ci/(test_classify_sep2828_fallback|test_reproduce_sep2828_decision_pairing|bounded_download)|interop/classify_sep2828_fallback)\.py|scripts/interop/reproduce-sep2828-decision-pairing\.sh|docs/interop/sep2828-decision-pairing-v0\.md|\.pre-commit-config\.yaml)$

      - id: docs-generated-drift
        name: Generated docs match their generators
        entry: bash scripts/ci/check-docs-generated-drift.sh
        language: system
        pass_filenames: false
        # The drift used to be found *after* a merge, by `docs-auto-update.yml`, which then opened a
        # PR from `docs/auto-update` that could never be checked: `create-pull-request` signs it with
        # the default GITHUB_TOKEN, and GitHub does not run workflows for that token's events. #2021
        # sat blocked for a day with fifteen `action_required` runs and nothing to approve them
        # (#2080).
        #
        # Caught here instead, the diagram edge lands in the pull request that added the dependency,
        # where a reviewer can see why it moved. It also makes the bot's `has_changes` false by
        # construction, so the un-mergeable PR is never created.
        files: ^(Cargo\.toml|crates/.*/Cargo\.toml|scripts/docs/.*\.(sh|py)|scripts/ci/(read-assay-release-tag\.sh|lib/workspace_version\.py)|\.github/assay-release-tag|docs/data/product-capabilities\.v0\.json|docs/generated/.*|docs/reference/product-support\.md|docs/AIcontext/architecture-diagrams\.md|docs/guides/agent-golden-path\.md|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|packaging/agent-plugin/.*|scripts/ci/check-docs-generated-drift\.sh|\.gitattributes|\.pre-commit-config\.yaml)$

      - id: agent-golden-path-skill-contract
        name: Agent golden-path skill contract
        entry: bash -c 'python3 scripts/ci/test-agent-golden-path-skill.py && python3 scripts/ci/test-golden-path-mock-bounds.py && python3 scripts/ci/test-generate-agent-golden-path-check.py && bash scripts/ci/test-classify-lightweight-changes.sh'
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|scripts/docs/generate-agent-golden-path\.py|scripts/ci/(read-assay-release-tag\.sh|test-agent-golden-path-skill(-(optimization|hardening)\.sh|\.py)|test-golden-path-mock-bounds\.py|test-generate-agent-golden-path-check\.py|(test-)?classify-lightweight-changes\.sh|lib/(golden-path-fixture-staging\.sh|workspace_version\.py))|\.github/assay-release-tag|docs/generated/agent-golden-path\.json|docs/guides/agent-golden-path\.md|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|packaging/agent-plugin/.*|\.github/workflows/(kernel-matrix|ci)\.yml|\.gitignore|\.gitattributes|\.pre-commit-config\.yaml)$

      - id: agent-golden-path-skill-mutations
        name: Agent golden-path skill mutations
        entry: bash -c 'bash scripts/ci/test-agent-golden-path-skill-optimization.sh && bash scripts/ci/test-agent-golden-path-skill-hardening.sh'
        language: system
        pass_filenames: false
        # The mutation cases prove the validator has teeth, but their cost belongs
        # at the publish boundary rather than in every intermediate commit.
        stages: [pre-push]
        files: ^(Cargo\.toml|scripts/docs/generate-agent-golden-path\.py|scripts/ci/(read-assay-release-tag\.sh|test-agent-golden-path-skill(-(optimization|hardening)\.sh|\.py)|test-golden-path-mock-bounds\.py|test-generate-agent-golden-path-check\.py|lib/(golden-path-fixture-staging\.sh|workspace_version\.py))|\.github/assay-release-tag|docs/generated/agent-golden-path\.json|docs/guides/agent-golden-path\.md|\.(agents|claude)/skills/assay-golden-path/SKILL\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|packaging/agent-plugin/.*|\.github/workflows/kernel-matrix\.yml|\.gitignore|\.gitattributes|\.pre-commit-config\.yaml)$

      - id: published-release-golden-path-contract
        name: Published-release golden-path contract
        entry: bash scripts/ci/test-published-release-golden-path-contract.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(published-release-golden-path\.sh|published_release_proxy_phase\.py|test_published_release_proxy_phase\.py|lib/published-release-capture\.sh|test_published_release_session_phase\.py|test_published_release_request_cases\.py|check-published-release-golden-path-contract\.py|test-published-release-golden-path-contract\.sh|safe_extract_release_archive\.py|test_safe_extract_release_archive\.py|bounded_download\.py|test_bounded_download\.py|release_attestation_enforce\.sh|release_archive_inventory\.sh|test-release-attestation-enforce\.sh|fixtures/published-release-golden-path/.*)|examples/privileged-action-gate/(mock_github_mcp\.py|baseline-approved\.json|policies/(no-allowance|allow)\.yaml|run\.sh)|\.github/workflows/(published-release-golden-path|release)\.yml|\.pre-commit-config\.yaml)$

      - id: published-release-historical-retention-contract
        name: Published-release historical-retention contract
        entry: bash scripts/ci/test-published-release-historical-retention-contract.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(scripts/ci/(published-release-historical-retention\.sh|check-published-release-historical-retention-contract\.py|test-published-release-historical-retention-contract\.sh|release_attestation_enforce\.sh|release_archive_inventory\.sh|safe_extract_release_archive\.py|bounded_download\.py|fixtures/published-release-historical-retention/.*)|\.github/workflows/published-release-historical-retention\.yml|\.pre-commit-config\.yaml)$

      - id: release-quickstart-contract
        name: Released quickstart is self-contained and byte-true
        entry: python3 scripts/ci/test_release_quickstart.py
        language: system
        pass_filenames: false
        files: ^(README\.md|examples/mcp-quickstart/(README\.md|policy\.yaml|run\.py|mock_server\.py)|scripts/ci/(release_readme|test_release_quickstart)\.py|\.github/workflows/release\.yml|\.pre-commit-config\.yaml)$

      - id: claude-plugin-install-workflow-self-test
        name: Claude plugin install workflow self-test
        entry: bash scripts/ci/test-claude-plugin-install.sh --self-test
        language: system
        pass_filenames: false
        # The full mutation suite drives install/update/cache/MCP/session behavior and
        # costs several seconds warm. Keep commit-time feedback fast; the same hook is
        # installed and enforced before push, where end-to-end workflow proof belongs.
        stages: [pre-push]
        files: ^(CHANGELOG\.md|scripts/ci/(test-claude-plugin-install\.sh|claude_plugin_install_workflow\.py)|docs/guides/editor-mcp-recipe\.md|\.claude-plugin/.*|packaging/claude-plugin/.*|\.pre-commit-config\.yaml)$

      - id: claude-plugin-install-import-safe
        name: Claude plugin install workflow is import-safe
        entry: python3 scripts/ci/test_claude_plugin_install_import.py
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(claude_plugin_install_workflow|test_claude_plugin_install_import)\.py|\.pre-commit-config\.yaml)$

      - id: docs-auto-update-reconcile-self-test
        name: Docs auto-update reconciliation self-test
        entry: bash scripts/ci/test-reconcile-docs-auto-pr.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(reconcile-docs-auto-pr|test-reconcile-docs-auto-pr)\.sh|\.github/workflows/(docs-auto-update|ci|assay-runner-lane-check|host-capability-check)\.yml|\.pre-commit-config\.yaml)$

      - id: host-capability-proof-contract
        name: Host-capability proof cold-start contract
        entry: bash scripts/ci/test-host-capability-proof-contract.sh --self-test
        language: system
        pass_filenames: false
        files: ^(scripts/ci/test-host-capability-proof-contract\.sh|\.github/workflows/host-capability-proof\.yml|docs/reference/runner/host-capability-proof\.md|\.pre-commit-config\.yaml)$

      - id: evidence-vocabulary-self-test
        name: Evidence vocabulary guard self-test
        entry: bash scripts/ci/test-evidence-vocabulary.sh
        language: system
        pass_filenames: false
        files: ^(scripts/ci/(check-evidence-vocabulary\.py|test-evidence-vocabulary\.sh)|\.pre-commit-config\.yaml)$

      - id: mcp-tool-error-publication-self-test
        name: MCP ToolError publication guard self-test
        entry: bash -c 'python3 scripts/ci/check-mcp-tool-error-publication.py && bash scripts/ci/test-check-mcp-tool-error-publication.sh'
        language: system
        pass_filenames: false
        files: ^(crates/assay-mcp-server/src/tools/mod\.rs|scripts/ci/(check-mcp-tool-error-publication\.py|test-check-mcp-tool-error-publication\.sh)|\.pre-commit-config\.yaml)$

      - id: mcp-policy-yaml-routing-self-test
        name: MCP policy YAML routing guard self-test
        entry: bash -c 'python3 scripts/ci/check-mcp-policy-yaml-routing.py && bash scripts/ci/test-check-mcp-policy-yaml-routing.sh'
        language: system
        pass_filenames: false
        files: ^(crates/assay-core/src/mcp/policy/.*\.rs|crates/assay-mcp-server/src/tools/.*\.rs|scripts/ci/(check-mcp-policy-yaml-routing\.py|test-check-mcp-policy-yaml-routing\.sh)|\.pre-commit-config\.yaml)$

      - id: mcp-policy-reader-routing-self-test
        name: MCP policy reader routing guard self-test
        entry: bash -c 'python3 scripts/ci/check-mcp-policy-reader-routing.py && bash scripts/ci/test-check-mcp-policy-reader-routing.sh'
        language: system
        pass_filenames: false
        files: ^(crates/assay-mcp-server/src/(config\.rs|main\.rs|tools/.*\.rs)|scripts/ci/(check-mcp-policy-reader-routing\.py|test-check-mcp-policy-reader-routing\.sh)|\.pre-commit-config\.yaml)$

      - id: mcp-policy-parser-delegation-self-test
        name: MCP policy parser delegation guard self-test
        entry: bash -c 'python3 scripts/ci/check-mcp-policy-parser-delegation.py && bash scripts/ci/test-check-mcp-policy-parser-delegation.sh'
        language: system
        pass_filenames: false
        files: ^(crates/assay-core/src/mcp/policy/(mod|legacy)\.rs|scripts/ci/(check-mcp-policy-parser-delegation\.py|test-check-mcp-policy-parser-delegation\.sh)|\.pre-commit-config\.yaml)$

      - id: evidence-vocabulary
        name: Evidence vocabulary guard
        entry: python3 scripts/ci/check-evidence-vocabulary.py
        language: system
        pass_filenames: false
        always_run: true
        # No files: filter. A start-condition regex of today's surfaces would
        # skip a new path such as docs/new-page.md, which is the recurrence
        # this hook exists to catch. The scan is ~1.7s.

      - id: aee-seal-producer-mutations
        name: ADR-045 seal producer mutations
        entry: bash -c 'python3 scripts/ci/test_aee_seal_producer_mutation_safety.py && python3 scripts/ci/test_aee_seal_producer_mutations.py'
        language: system
        pass_filenames: false
        # Each mutation names the test that must catch it. Run by hand this went wrong four times in
        # one session; mechanised it has not. Restores from scratch bytes held in-process, never from
        # git, and SIGINT/SIGTERM handlers rewrite those bytes before exit so an interrupted push
        # cannot leave the first mutant behind (#2318).
        #
        # pre-push, not pre-commit: fourteen `cargo test` runs cost ~56s warm, and a gate that taxes
        # every intermediate commit is a gate people learn to pass `--no-verify` to. The question it
        # answers -- does this suite still have teeth -- is a push-time question.
        #
        # Trigger is content paths only: editing unrelated hook config must not run this battery.
        stages: [pre-push]
        files: ^(crates/assay-cli/src/aee_seal\.rs|scripts/ci/test_aee_seal_producer_mutations\.py|scripts/ci/test_aee_seal_producer_mutation_safety\.py)$
      - id: aee-seal-producer-residue
        name: ADR-045 seal producer mutation residue
        entry: python3 scripts/ci/test_aee_seal_producer_mutations.py --check-residue
        language: system
        pass_filenames: false
        # Read-only fail-closed check: every declared mutant search anchor must still be present.
        # Catches interruption residue on the next commit without rewriting production code.
        files: ^(crates/assay-cli/src/aee_seal\.rs|scripts/ci/test_aee_seal_producer_mutations\.py)$
      - id: aee-seal-checker-coverage
        name: ADR-045 seal checker coverage
        entry: bash -c 'f=scripts/experiments/aee_landlock_seal_fixture.py; python3 $f --meta-test && python3 $f --required-field-test && python3 $f --rule-coverage-test && python3 $f --producer-vocabulary-test'
        language: system
        pass_filenames: false
        # Four properties the checker claims and nothing was checking.
        #
        # `--meta-test` says every negative control rejects for its own reason and no other; without
        # it a rule that fires on every control would read as broad coverage instead of one
        # indiscriminate rejection.
        #
        # `--required-field-test` says every field the contract marks required is refused when
        # absent, which is what the #2060 sweep found five gaps in.
        #
        # `--rule-coverage-test` says every reason code the checker can produce has a control that
        # produces it. The first two say nothing about a rule with no control at all, and there were
        # nine -- including the one #1998 requires by name. A rule can exist, be believed, and never
        # be shown to fire.
        #
        # `--producer-vocabulary-test` says an Assay producer member withholds credit and never
        # voids the record. The other three are blind to it: a phase is one word passed to `add`,
        # so `assayDropProofModel` decided AEE structural validity for two slices while all three
        # stayed green, and six sibling members did for three. It also reads `validate` back, so a
        # producer member that acquires a rule cannot acquire a phase by default.
        #
        # pre-commit, not pre-push: all four run in well under a second, and they are the tests
        # that tell you a rule you just wrote does not isolate.
        files: ^(scripts/experiments/aee_landlock_seal_fixture\.py|scripts/experiments/fixtures/aee-landlock-seal/.*|\.pre-commit-config\.yaml)$
      - id: aee-seal-fixture-drift
        name: ADR-045 seal fixture drift
        entry: bash scripts/ci/check-aee-seal-fixture-drift.sh
        language: system
        pass_filenames: false
        # The Rust producer's parity tests read `derivation-parity.json`, so the emitter and the
        # committed vectors have to stay in step; nothing else regenerates them.
        files: ^(scripts/experiments/aee_landlock_seal_fixture\.py|scripts/experiments/fixtures/aee-landlock-seal/.*|scripts/ci/check-aee-seal-fixture-drift\.sh|crates/assay-cli/src/aee_seal\.rs|\.pre-commit-config\.yaml)$
      - id: wildcard-expectations
        name: Wildcard suppressions still needed
        entry: bash scripts/ci/check-wildcard-expectations.sh
        language: system
        pass_filenames: false
        # `wildcard_enum_match_arm` is a restriction lint and stays off by default -- #2055 measured
        # why: it fires on foreign enums too, and `KeyCode` alone would need ~25 arms that do
        # nothing. But with it off, `unfulfilled_lint_expectations` never fires either, so every
        # `#[expect]` documents a decision that nothing re-checks. This runs the lint just long
        # enough to evaluate the expectations, and fails only on one that has gone stale.
        #
        # pre-push: a workspace clippy run is too slow to tax every intermediate commit.
        stages: [pre-push]
        files: ^(crates/.*\.rs|scripts/ci/check-wildcard-expectations\.sh|\.pre-commit-config\.yaml)$
      - id: runner-gating-map-drift
        name: Runner gating map drift
        entry: bash scripts/ci/check-runner-gating-map-drift.sh
        language: system
        pass_filenames: false
        # No `files:` filter on purpose. The map is derived from `git ls-files`,
        # so its input set is the whole tree while any trigger list is a handful
        # of paths -- adding a file under `runner-fixtures/` changed the map and
        # skipped the hook. The check costs ~0.2s, which is cheaper than a
        # trigger list that has to be kept in step with the gated surface.
      - id: fuzz-lane-contract-self-test
        name: Fuzz lane contract
        entry: bash scripts/ci/test-fuzz-lane-contract.sh
        language: system
        pass_filenames: false
        # `fuzz/Cargo.{toml,lock}` included: the contract derives the lane's required path filter
        # from the lock, so a change there can invalidate the assertion without touching either
        # file that used to trigger this hook.
        files: ^(scripts/ci/test-fuzz-lane-contract\.sh|\.github/workflows/fuzz-smoke\.yml|fuzz/Cargo\.(toml|lock)|\.pre-commit-config\.yaml)$

      - id: git-fixture-env-isolation
        name: Git fixture tests isolate hook repository state
        entry: bash scripts/ci/test-git-fixture-env-isolation.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^scripts/ci/(lib/clear-git-repository-env|test-(check-release-surface|check-python-artifact-truth|check-python-wheel-smoke-contract|git-fixture-env-isolation|perf-pr-event-provenance-contract))\.sh$

      - id: release-surface
        name: Release surface matches source and published versions
        entry: bash -c 'bash scripts/ci/test-check-release-surface.sh && bash scripts/ci/check-release-surface.sh'
        language: system
        pass_filenames: false
        # Triggers on the files it can be wrong about, plus itself. It does not need a binary: with
        # no `target/` build it still verifies source and published-release truth independently.
        files: ^(scripts/ci/((check|test-check)-release-surface|read-assay-release-tag)\.sh|scripts/ci/(release_readme|test_release_quickstart)\.py|\.github/assay-release-tag|Cargo\.toml|README\.md|SECURITY\.md|llms\.txt|mkdocs\.yml|examples/mcp-quickstart/README\.md|docs/(COMMUNITY\.md|index\.md|getting-started/(index|installation|quickstart|ci-integration)\.md|reference/cli/index\.md|python-sdk/index\.md|use-cases/(air-gapped|ci-gate)\.md|AIcontext/user-flows\.md|migration-v1\.2\.md|guides/editor-mcp-recipe\.md)|\.devcontainer/welcome\.sh|demo/CODESPACES-PLAYBOOK\.md|\.pre-commit-config\.yaml)$



      - id: python-artifact-truth
