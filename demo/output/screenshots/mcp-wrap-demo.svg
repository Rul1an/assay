<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Quickstart decision recorded for the local mock">
  <style>
    .bg{fill:#0d1117}
    .bar{fill:#161b22}
    .txt{fill:#c9d1d9;font-size:15px}
    .dim{fill:#8b949e;font-size:15px}
    .prompt{fill:#58a6ff;font-size:15px}
    .allow{fill:#3fb950;font-size:15px;font-weight:600}
    .deny{fill:#f85149;font-size:15px;font-weight:600}
    .reason{fill:#8b949e;font-size:14px}
    .title{fill:#8b949e;font-size:13px}
  </style>
  <rect class="bg" x="2" y="2" width="756" height="356" rx="10"/>
  <rect class="bar" x="2" y="2" width="756" height="34" rx="10"/>
  <rect class="bar" x="2" y="20" width="756" height="16"/>
  <circle cx="24" cy="19" r="6" fill="#f85149"/>
  <circle cx="44" cy="19" r="6" fill="#d29922"/>
  <circle cx="64" cy="19" r="6" fill="#3fb950"/>
  <text class="title" x="380" y="24" text-anchor="middle">Assay MCP quickstart</text>
  <text class="txt" x="22" y="72">$ python3 examples/mcp-quickstart/run.py</text>
  <text class="txt" x="22" y="115">assay quickstart: PASS</text>
  <text class="txt" x="22" y="158">mcp_requests=initialize,tools/list,tools/call</text>
  <text class="txt" x="22" y="201">decision=allow tool=read_file</text>
  <text class="txt" x="22" y="244">decision_artifact=.assay/quickstart/decisions.ndjson</text>
  <text class="txt" x="22" y="287">non_claim=forwarded_to_local_mock_only</text>
</svg>
