version: "2.0"
name: "mcp-hardened"

# Setup: Allowlist only.
# Use this for CI or Production Agent Gates.

tools:
  allow:
    # Essential Tools Only (Explicit Allow)
    - "read_file"
    - "list_directory"
    - "search_files"
    - "get_time"

  deny:
    # Explicit deny for high-risk categories (redundant but safe)
    - "exec*"
    - "shell*"
    - "write_file"
    - "delete_file"
    - "replace_file"
    - "move_file"

schemas:
  # Check literal POSIX path arguments for the named tools.
  read_file: &approved_path
    type: object
    additionalProperties: true
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
        pattern: '^/(app|data)/'
        not:
          pattern: '(^|/)\.{1,2}(/|$)|//|[\\\u0000-\u001F\u007F]'

  list_directory: *approved_path
  search_files: *approved_path
