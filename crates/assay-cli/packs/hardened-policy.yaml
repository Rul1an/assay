version: "2.0"
name: "mcp-hardened"

# Setup: Allowlist only. Strict containment.
# Use this for CI or Production Agent Gates.

tools:
  allow:
    # Essential Tools Only (Explicit Allow)
    - "read_file"
    - "list_directory"
    - "search_files"
    - "get_time"

  deny:
    # Explicit deny for high-risk categories (redundant but safe)
    - "exec*"
    - "shell*"
    - "write_file"
    - "delete_file"
    - "replace_file"
    - "move_file"

schemas:
  # Strict containment (No /workspace root access)
  read_file:
    type: object
    additionalProperties: true
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
        pattern: "^/app/.*|^/data/.*"

  list_directory:
    type: object
    additionalProperties: true
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
        pattern: "^/app/.*|^/data/.*"
