version: "2.0"
name: "mcp-dev"

# Setup: Permissive but sane.
# Use this for local development.

tools:
  allow:
    - "*"

  deny:
    # RCE Prevention (Always block these)
    - "exec"
    - "shell"
    - "bash"
    - "cmd"
    - "powershell"
    - "spawn"
    - "python_sandbox"

schemas:
  # Basic containment to project root
  read_file:
    type: object
    additionalProperties: true
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
        pattern: "^/app/.*|^/data/.*|^/workspace/.*"
