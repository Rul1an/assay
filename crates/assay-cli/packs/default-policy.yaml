version: "2.0"
name: "mcp-dev"

# Local development: allow all tools except the names listed below.

tools:
  allow:
    - "*"

  deny:
    # Exact tool names blocked by this preset
    - "exec"
    - "shell"
    - "bash"
    - "cmd"
    - "powershell"
    - "spawn"
    - "python_sandbox"

schemas:
  # Check literal POSIX path arguments for the named tools.
  read_file:
    type: object
    additionalProperties: true
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
        pattern: '^/(app|data|workspace)/'
        not:
          pattern: '(^|/)\.{1,2}(/|$)|//|[\\\u0000-\u001F\u007F]'
