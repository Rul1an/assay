[package]
name = "assay-mcp-server"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "MCP server integration for Assay"
# Workspace-only contract: reads generated docs and shared test support outside this package.
exclude = ["tests/agent_golden_path_contract.rs"]

[lints]
workspace = true

[features]
experimental = ["assay-core/experimental"]
# Test-only: adds assay_test_outbound tool for E6a.3 no-pass-through E2E test.
# Use: cargo test -p assay-mcp-server --features test-outbound
test-outbound = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["full", "fs"] }
assay-core.workspace = true
assay-common = { workspace = true, features = ["std"] }
assay-metrics.workspace = true
sha2.workspace = true
hex.workspace = true
moka = { version = "0.12", features = ["sync"] }

tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
# aws_lc_rs (not rust_crypto): drops the rsa crate / RUSTSEC-2023-0071 from the tree.
# aws-lc-rs is already resolved in this workspace via rustls/object_store; standalone
# assay-mcp-server builds may compile it through this feature selection.
jsonwebtoken = { version = "11.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
anyhow.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
wiremock = "0.6"
jsonwebtoken = { version = "11.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64 = "0.23"
# uuid = { version = "1.0", features = ["v4"] } # Removed in favor of SystemTime
# Runtime RSA keygen for the legacy RS256 compatibility test (no checked-in PEM).
aws-lc-rs = "1.16"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
process-wrap = { workspace = true, features = ["process-group", "std"] }

[target.'cfg(windows)'.dev-dependencies]
process-wrap = { workspace = true, features = ["job-object", "std"] }
